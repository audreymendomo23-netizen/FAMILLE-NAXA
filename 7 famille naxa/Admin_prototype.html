<!DOCTYPE html>

<title>Administration — famille d'applications</title>
<style>
  :root{--navy:#0D2E57;--green:#5E8A2E;--light:#EEF4E6;--bg:#F6F8FB;--text:#1B2430;--line:#D5DCE8;--ok:#197A33;--bad:#C62828;--warn:#8F5400}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:2}
  header h1{margin:0;font-size:17px}

  nav button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;white-space:nowrap;cursor:pointer;color:var(--text)}
  nav button[aria-selected="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
  main{padding:14px;max-width:980px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .kpi b{display:block;font-size:26px;color:var(--navy)} .kpi span{color:#55627a;font-size:13px}
  h2{font-size:17px;margin:4px 0 10px;color:var(--navy)}
  table{width:100%;border-collapse:collapse;font-size:14px} th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top} th{font-size:12px;color:#55627a;text-transform:uppercase;letter-spacing:.03em}

  button.ok{background:var(--ok)} button.no{background:var(--bad)} button.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
  label{display:block;font-size:13px;color:#55627a;margin:10px 0 3px} input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}

  .tag.ok{color:var(--ok);border-color:var(--ok)} .tag.bad{color:var(--bad);border-color:var(--bad)} .tag.warn{color:var(--warn);border-color:var(--warn)}
  .note{font-size:13px;color:#55627a} .total{font-size:22px;font-weight:700;color:var(--navy)}
  .apps label{display:flex;gap:8px;align-items:center;margin:6px 0;color:var(--text);font-size:15px}
  .apps input{width:auto} .hidden{display:none}
  .banner{background:#FFF4DC;border:1px solid #E6C77A;color:#6a4a00;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
</style>

<body>
<header><h1>Administration — famille d'applications</h1><small>Prototype de démonstration : données fictives en mémoire, rien n'est enregistré</small></header>
<nav id="tabs" role="tablist"></nav>
<main id="view"></main>
<script>
// Montants en francs CFA : entiers, jamais de décimales.
const toInt = (n) => { if (!Number.isFinite(n)) throw new Error("montant invalide"); return Math.round(n); };
function formatFCFA(n) {
  const v = toInt(n); const s = Math.abs(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (v < 0 ? "-" : "") + s + " F";
}
// Lit « 45 000 F », « 45.000 », « 45,000 FCFA », « 1 000F » -> 45000 (entier) ; sinon null.
function parseFCFA(text) {
  if (typeof text !== "string") return null;
  const m = text.replace(/\u00a0|\u202f/g, " ").match(/(-?\d{1,3}(?:[ .,]\d{3})+|-?\d+)\s*(?:F\s*CFA|FCFA|XAF|F)?/i);
  if (!m) return null;
  return parseInt(m[1].replace(/[ .,]/g, ""), 10);
}
const floorTo100 = (n) => Math.floor(n / 100) * 100;


// Grilles de prix mensuels (francs CFA). Source : cahiers des charges 01 à 07 (tous marqués [P] : à tester sur le terrain).
const APPS = {
  kiosko:        { name: "Kiosko",        tiers: { essentiel: 1000, services: 1500, complet: 3000 }, extraPoint: { price: 500, tiers: ["services", "complet"] }, singlePointTiers: ["essentiel"], offlineDays: { essentiel: 7, services: 7, complet: 14 } },
  bootik:        { name: "Bootik",        tiers: { essentiel: 1000, pro: 3000, reseau: 6000 },       extraPoint: { price: 500, tiers: ["pro"] },  singlePointTiers: ["essentiel"], offlineDays: { essentiel: 7, pro: 7, reseau: 14 } },
  zipple:        { name: "Zipple",        tiers: { essentiel: 1000, pro: 3000, reseau: 6000 },       extraPoint: { price: 500, tiers: ["pro"] },  singlePointTiers: ["essentiel"], offlineDays: { essentiel: 7, pro: 7, reseau: 14 } },
  naxa_services: { name: "NAXA Services", tiers: { essentiel: 1000, pro: 3000, reseau: 6000 },       extraPoint: { price: 500, tiers: ["pro"] },  singlePointTiers: ["essentiel"], offlineDays: { essentiel: 7, pro: 7, reseau: 14 } },
  cotiz:         { name: "CotiZ",         tiers: { essentiel: 500, pro: 1500, reseau: 3000 },        extraPoint: null,                             singlePointTiers: [],            offlineDays: { essentiel: 7, pro: 7, reseau: 14 } },
  loyable:       { name: "Loyable",       tiers: { essentiel: 1000, pro: 3000, reseau: 6000 },       extraPoint: null,                             singlePointTiers: [],            offlineDays: { essentiel: 7, pro: 7, reseau: 14 } },
  naxa_hotel:    { name: "NAXA Hotel",    tiers: { essentiel: 3000, pro: 8000, reseau: 20000 },      extraPoint: { price: 2000, tiers: ["pro"] }, singlePointTiers: ["essentiel"], offlineDays: { essentiel: 7, pro: 7, reseau: 14 } },
};
const DURATIONS = [1, 3, 6, 12];

// Prix d'un forfait pour un prix mensuel donné : 3 mois = -10 % arrondi à la centaine inférieure ; 6 mois = 5 payés ; 12 mois = 10 payés.
function packagePrice(monthly, months) {
  switch (months) {
    case 1: return monthly;
    case 3: return floorTo100(monthly * 3 * 0.9);
    case 6: return monthly * 5;
    case 12: return monthly * 10;
    default: throw new Error("durée inconnue : " + months);
  }
}
// Mois réellement offerts par le forfait (6 mois -> 1 offert ; 12 mois -> 2 offerts).
const includedFreeMonths = (months) => (months === 6 ? 1 : months === 12 ? 2 : 0);

function priceOf(app, tier, months = 1, extraPoints = 0) {
  const a = APPS[app]; if (!a || !(tier in a.tiers)) throw new Error("application ou palier inconnu");
  let total = packagePrice(a.tiers[tier], months);
  if (extraPoints > 0) {
    if (!a.extraPoint || !a.extraPoint.tiers.includes(tier)) throw new Error("points supplémentaires non permis pour ce palier");
    total += extraPoints * packagePrice(a.extraPoint.price, months);
  }
  return total;
}
// Montée de palier immédiate : (différence de prix mensuel) x jours restants / 30, minimum 100 F, échéance inchangée.
// Calculé sur la valeur mensuelle du palier, pas sur le prix réduit du forfait. Arrondi au franc le plus proche (à confirmer).
function upgradeSupplement(oldMonthly, newMonthly, daysLeft) {
  if (newMonthly <= oldMonthly) throw new Error("ce n'est pas une montée de palier");
  if (daysLeft < 0) throw new Error("jours restants invalides");
  return Math.max(100, toInt(((newMonthly - oldMonthly) * daysLeft) / 30));
}
// Ajout d'un point en cours de période : prix mensuel du point x jours restants / 30 (même arrondi). Minimum 100 F.
const extraPointProrata = (monthlyPointPrice, daysLeft) => Math.max(100, toInt((monthlyPointPrice * daysLeft) / 30));

// Mois offerts : plafond de 3 mois par an hors mois inclus dans les forfaits 6 et 12 mois.
// Le code promo n'est pas cumulable avec la bienvenue (la bienvenue gagne si les deux sont demandés).
function grantMonths({ alreadyGrantedThisYear = 0, requested = [] }) {
  const CAP = 3; let remaining = Math.max(0, CAP - alreadyGrantedThisYear); const granted = []; let refused = [];
  const hasWelcome = requested.some((r) => r.type === "bienvenue");
  for (const r of requested) {
    if (r.type === "promo" && hasWelcome) { refused.push({ ...r, reason: "promo non cumulable avec bienvenue" }); continue; }
    const g = Math.min(remaining, r.months); if (g > 0) granted.push({ type: r.type, months: g });
    if (g < r.months) refused.push({ ...r, months: r.months - g, reason: "plafond annuel atteint" });
    remaining -= g;
  }
  return { granted, refused, totalGranted: granted.reduce((s, g) => s + g.months, 0) };
}
// Offre de bienvenue : paiement dans les 48 h après la fin de la période accordée.
const welcomeEligible = (periodEndMs, paidAtMs) => paidAtMs >= periodEndMs - 0 && paidAtMs - periodEndMs <= 48 * 3600 * 1000;
// Parrainage : mois accordé après le premier paiement réel du filleul.
const referralMonthsDue = (refereeHasRealPayment) => (refereeHasRealPayment ? 1 : 0);

// Tolérance hors connexion. days = jours entiers depuis la dernière synchronisation (heure du serveur mémorisée).
function offlineState({ nowMs, lastSyncMs, lastSeenMs, limitDays }) {
  if (lastSeenMs != null && nowMs < lastSeenMs) return { state: "restricted", reason: "recul d'horloge" };
  const days = Math.floor((nowMs - lastSyncMs) / 86400000);
  if (days >= limitDays) return { state: "restricted", reason: "tolérance dépassée", days };
  if (days >= 4) return { state: "warning", days, deadlineMs: lastSyncMs + limitDays * 86400000 };
  return { state: "ok", days };
}
// Blocage après échéance : l'enregistrement local des SMS s'arrête après 60 jours.
function blockedState({ nowMs, dueMs }) {
  if (nowMs <= dueMs) return { state: "active" };
  const days = Math.floor((nowMs - dueMs) / 86400000);
  return { state: days >= 60 ? "blocked_recording_stopped" : "blocked_recording", days };
}

</script>
<script>
"use strict";
// ---------------------------------------------------------------------------------------------
// Couche de données : ICI se branche Supabase (prompt 0.10). Le prototype utilise des données fictives en mémoire.
const Backend = {
  state: {
    clients: [
      { id: 1, name: "Boutique Chez Paulette", phone: "670000001", apps: [{ app: "bootik", tier: "pro", dueDays: 5, status: "active" }] },
      { id: 2, name: "Maquis Le Palmier", phone: "670000002", apps: [{ app: "zipple", tier: "essentiel", dueDays: 2, status: "trial" }, { app: "naxa_hotel", tier: "essentiel", dueDays: 20, status: "active" }] },
      { id: 3, name: "Point Mobile Money Biyem-Assi", phone: "670000003", apps: [{ app: "kiosko", tier: "services", dueDays: -3, status: "blocked" }] },
    ],
    payments: [
      { id: 101, client: "Boutique Chez Paulette", app: "bootik", amount: 3000, txid: "TX-88121", payer: "670000001", state: "needs_review", note: "numéro du payeur différent du compte" },
      { id: 102, client: "Maquis Le Palmier", app: "zipple", amount: 2700, txid: "TX-88130", payer: "670000002", state: "pending", note: "en attente de lecture du SMS" },
    ],
    log: [],
  },
  listClients() { return this.state.clients; }, listPayments() { return this.state.payments; },
  decide(id, ok) { const p = this.state.payments.find((x) => x.id === id); if (!p) return; p.state = ok ? "validated" : "rejected"; this.state.log.unshift({ at: new Date().toLocaleTimeString("fr-FR"), text: `${ok ? "Validé" : "Rejeté"} : ${p.client}, ${formatFCFA(p.amount)}, ${p.txid}` }); },
  createClient(c) { c.id = this.state.clients.length + 1; this.state.clients.push(c); },
};
const h = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v); } for (const kid of kids.flat()) e.append(kid instanceof Node ? kid : document.createTextNode(String(kid ?? ""))); return e; };
const TIER_LABEL = { essentiel: "Essentiel", services: "Services", pro: "Pro", complet: "Complet", reseau: "Réseau" };
const STATE_TAG = { active: ["ok", "actif"], trial: ["warn", "essai"], blocked: ["bad", "bloqué"], suspended: ["bad", "suspendu"] };
const view = document.getElementById("view"); const tabs = document.getElementById("tabs");

function dashboard() {
  const clients = Backend.listClients(); const subs = clients.flatMap((c) => c.apps);
  const kpis = [["Clients actifs", subs.filter((s) => s.status === "active").length], ["Essais en cours", subs.filter((s) => s.status === "trial").length],
    ["Échéances sous 7 jours", subs.filter((s) => s.dueDays >= 0 && s.dueDays <= 7).length], ["Paiements à valider", Backend.listPayments().filter((p) => ["pending", "needs_review"].includes(p.state)).length],
    ["Revenu du mois", formatFCFA(Backend.listPayments().filter((p) => p.state === "validated").reduce((s, p) => s + p.amount, 0))], ["Départs du mois", subs.filter((s) => s.status === "blocked").length]];
  return h("div", {}, h("div", { class: "banner" }, "Les six chiffres de l'écran d'accueil (cahier, section 13.4). L'administration ne voit jamais les transactions détaillées des clients."),
    h("div", { class: "grid" }, kpis.map(([l, v]) => h("div", { class: "card kpi" }, h("b", {}, v), h("span", {}, l)))));
}
function paymentsView() {
  const rows = Backend.listPayments();
  const body = h("tbody", {}, rows.map((p) => h("tr", {}, h("td", {}, p.client, h("div", { class: "note" }, APPS[p.app].name)), h("td", {}, formatFCFA(p.amount)), h("td", {}, p.txid, h("div", { class: "note" }, p.note)),
    h("td", {}, p.state === "validated" ? h("span", { class: "tag ok" }, "validé") : p.state === "rejected" ? h("span", { class: "tag bad" }, "rejeté") : [h("button", { class: "act ok", onclick: () => { Backend.decide(p.id, true); render(); } }, "Valider"), h("button", { class: "act no", onclick: () => { Backend.decide(p.id, false); render(); } }, "Rejeter")]))));
  return h("div", {}, h("div", { class: "card" }, h("h2", {}, "File des paiements"), h("div", { class: "tablewrap" }, h("table", {}, h("thead", {}, h("tr", {}, ["Client", "Montant", "Transaction", "Action"].map((t) => h("th", {}, t)))), body))),
    h("div", { class: "card" }, h("h2", {}, "Journal"), Backend.state.log.length ? h("ul", {}, Backend.state.log.map((l) => h("li", {}, `${l.at} — ${l.text}`))) : h("p", { class: "note" }, "Aucune décision pour l'instant.")));
}
function clientsView() {
  const list = Backend.listClients();
  const t = h("tbody", {}, list.map((c) => h("tr", {}, h("td", {}, c.name, h("div", { class: "note" }, c.phone)), h("td", {}, c.apps.map((a) => h("div", {}, `${APPS[a.app].name} · ${TIER_LABEL[a.tier]} `, h("span", { class: "tag " + STATE_TAG[a.status][0] }, STATE_TAG[a.status][1]), h("span", { class: "note" }, a.dueDays >= 0 ? ` échéance dans ${a.dueDays} j` : ` échu depuis ${-a.dueDays} j`)))))));
  return h("div", { class: "card" }, h("h2", {}, "Clients"), h("div", { class: "tablewrap" }, h("table", {}, h("thead", {}, h("tr", {}, ["Client", "Applications"].map((x) => h("th", {}, x)))), t)));
}
// Création d'un accès : seule l'administration peut le faire (pas d'inscription libre).
function createView() {
  const name = h("input", { id: "f-name", placeholder: "Nom du commerce ou du client" }), phone = h("input", { id: "f-phone", inputmode: "tel", placeholder: "Téléphone (identifiant de connexion)" });
  const months = h("select", { id: "f-months" }, [1, 3, 6, 12].map((m) => h("option", { value: m }, m + (m === 1 ? " mois" : " mois"))));
  const trial = h("input", { id: "f-trial", type: "number", min: "0", value: "0" });
  const picks = {}; const box = h("div", { class: "apps" });
  for (const [id, a] of Object.entries(APPS)) {
    const cb = h("input", { type: "checkbox", id: "app-" + id }); const sel = h("select", { id: "tier-" + id }, Object.keys(a.tiers).map((t) => h("option", { value: t }, `${TIER_LABEL[t]} — ${formatFCFA(a.tiers[t])}/mois`)));
    const pts = h("input", { type: "number", min: "0", value: "0", id: "pts-" + id, "aria-label": "Points supplémentaires" }); picks[id] = { cb, sel, pts };
    box.append(h("div", { class: "card" }, h("label", { class: "" }, cb, a.name), h("div", { class: "row" }, h("div", {}, h("label", {}, "Palier"), sel), a.extraPoint ? h("div", {}, h("label", {}, "Points supplémentaires"), pts) : h("span"))));
  }
  const total = h("div", { class: "total", id: "f-total" }, "0 F"), detail = h("div", { class: "note", id: "f-detail" }), msg = h("div", { id: "f-msg", class: "note" });
  const compute = () => { let sum = 0; const lines = []; for (const [id, p] of Object.entries(picks)) { if (!p.cb.checked) continue; try { const price = priceOf(id, p.sel.value, +months.value, APPS[id].extraPoint ? +p.pts.value : 0); sum += price; lines.push(`${APPS[id].name} ${TIER_LABEL[p.sel.value]} : ${formatFCFA(price)}`); } catch (e) { lines.push(`${APPS[id].name} : ${e.message}`); } } total.textContent = formatFCFA(sum); detail.textContent = lines.join(" · "); };
  box.addEventListener("input", compute); box.addEventListener("change", compute); months.addEventListener("change", compute);
  const save = h("button", { class: "act", id: "f-save", onclick: () => {
    const chosen = Object.entries(picks).filter(([, p]) => p.cb.checked);
    if (!name.value.trim() || !/^\d{8,12}$/.test(phone.value.trim()) || !chosen.length) { msg.textContent = "Renseignez le nom, un téléphone valide (8 à 12 chiffres) et au moins une application."; return; }
    for (const [id, p] of chosen) { if (APPS[id].extraPoint === null && +p.pts.value > 0) { msg.textContent = "Points supplémentaires non permis pour " + APPS[id].name; return; } }
    const trialDays = +trial.value || 0;
    Backend.createClient({ name: name.value.trim(), phone: phone.value.trim(), apps: chosen.map(([id, p]) => ({ app: id, tier: p.sel.value, dueDays: trialDays || 30 * +months.value, status: trialDays ? "trial" : "active" })) });
    msg.textContent = "Accès créé (démonstration). Identifiants remis par l'administration ; changement de mot de passe obligatoire à la première connexion."; compute();
  } }, "Créer l'accès");
  return h("div", { class: "card" }, h("h2", {}, "Créer un accès client"), h("p", { class: "note" }, "Pas d'inscription libre : seule l'administration crée les accès (cahier, section S1)."),
    h("label", {}, "Nom"), name, h("label", {}, "Téléphone"), phone, h("div", { class: "row" }, h("div", {}, h("label", {}, "Durée payée"), months), h("div", {}, h("label", {}, "Essai accordé (jours)"), trial)),
    h("h2", {}, "Applications autorisées"), box, h("div", { class: "card" }, h("div", { class: "note" }, "Montant à payer"), total, detail), save, msg);
}
// Montée de palier : calculateur.
function toolsView() {
  const o = h("input", { id: "u-old", type: "number", value: "1000" }), n = h("input", { id: "u-new", type: "number", value: "1500" }), d = h("input", { id: "u-days", type: "number", value: "15" });
  const out = h("div", { class: "total", id: "u-out" }), calc = () => { try { out.textContent = formatFCFA(upgradeSupplement(+o.value, +n.value, +d.value)); } catch (e) { out.textContent = e.message; } };
  [o, n, d].forEach((x) => x.addEventListener("input", calc)); calc();
  return h("div", { class: "card" }, h("h2", {}, "Montée de palier (complément)"), h("p", { class: "note" }, "(prix mensuel du nouveau palier − ancien) × jours restants ÷ 30, minimum 100 F. Exemple du cahier : 15 jours, 1 000 → 1 500 F = 250 F."),
    h("div", { class: "row" }, h("div", {}, h("label", {}, "Ancien prix mensuel"), o), h("div", {}, h("label", {}, "Nouveau prix mensuel"), n), h("div", {}, h("label", {}, "Jours restants"), d)), h("label", {}, "Complément à payer"), out);
}
const TABS = [["Accueil", dashboard], ["Paiements", paymentsView], ["Clients", clientsView], ["Créer un accès", createView], ["Outils", toolsView]];
let current = 0;
function render() { tabs.replaceChildren(...TABS.map(([l], i) => h("button", { role: "tab", "aria-selected": String(i === current), onclick: () => { current = i; render(); } }, l))); view.replaceChildren(TABS[current][1]()); }
render();
</script>
