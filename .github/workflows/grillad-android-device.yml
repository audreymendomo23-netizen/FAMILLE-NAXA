name: GRILLAD — Android virtual device smoke
on:
  push:
    branches: [work/grillad-foundation-20261127]
    paths:
      - 'scripts/grillad/gradle-ci.sh'
      - 'scripts/grillad/device-gradle-ci.sh'
      - 'supabase/drafts/grillad*.sql'
      - 'supabase/functions/grillad/**'
      - 'supabase/functions/grillad-drive/**'
      - 'apps/web/grillad/src/**'
      - 'apps/web/admin-console/src/GrilladAdmin.tsx'
      - 'supabase/local-tests/grillad_transverse_assertions.sql'
      - 'apps/android/grillad/**'
      - '.github/workflows/grillad-android-device.yml'
      - 'scripts/grillad/android-device-smoke.sh'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build unconfigured debug APK (no production access)
        run: bash scripts/grillad/device-gradle-ci.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/grillad/android-device-smoke.sh
