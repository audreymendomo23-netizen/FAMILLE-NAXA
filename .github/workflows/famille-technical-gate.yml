name: Famille NAXA — validation groupée 0.1/0.2

concurrency:
  group: famille-naxa-main-validation
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "supabase/drafts/**"
      - "supabase/tests/**"
      - "supabase/migrations/**"
      - "supabase/local-tests/**"
      - ".github/workflows/famille-technical-gate.yml"
      - "apps/**"
      - "android/**"
      - "web/**"
      - "apps/android/**"
      - "apps/web/**"
      - "scripts/**"
      - "packages/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sql-postgres-17:
    name: SQL draft + contraintes + isolation par défaut
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: famille_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d famille_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: famille_test
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le minimum Supabase Auth pour le test isolé
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            email text UNIQUE
          );
          SQL
      - name: Exécuter le draft PostgreSQL 17 dans la base éphémère
        run: psql -v ON_ERROR_STOP=1 -f supabase/drafts/0001_famille_core_proposed.sql
      - name: Tester seed, clés composites et refus d'accès par défaut
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/0001_famille_core_smoke.sql

  app-build-readiness:
    name: Inventaire des 20 applications (preuve de build requise)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Générer les 10 socles Android et les 10 socles Web/PWA
        run: node scripts/bootstrap-foundations.mjs
      - name: Vérifier les 20 manifests
        shell: bash
        run: |
          set -euo pipefail
          apps=(kiosko bootik zipple naxa-services cotiz loyable naxa-hotel campus237 naxa-security grillad)
          for app in "${apps[@]}"; do
            test -f "apps/android/${app}/build.gradle.kts"
            test -f "apps/web/${app}/package.json"
            test -f "apps/android/${app}/src/main/AndroidManifest.xml"
            test -f "apps/web/${app}/manifest.webmanifest"
          done
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances Web
        run: npm install
      - name: Tester les contrats Web de sécurité et de distribution
        run: npm run test:core-web
      - name: Tester les calculs d'abonnement FCFA
        run: npm run test:billing
      - name: Vérifier les contrastes WCAG AA des thèmes
        run: node --test packages/design-system/test/contrast.test.js
      - name: Tester les contrats de synchronisation et conflits
        run: npm run test:contracts
      - name: Tester le moteur de règles explicables
        run: npm run test:assistant
      - name: Compiler les 10 applications Web/PWA
        run: npm run build:web
      - name: Installer Java et Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Définir le SDK Android préinstallé du runner
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/platforms"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Compiler les 10 applications Android natives
        run: gradle assembleDebug

      - name: Persister les 10 socles Android et 10 Web/PWA générés
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.gradle.kts build.gradle.kts gradle.properties package.json tsconfig.base.json packages apps infra
          if git diff --cached --quiet; then
            echo "Aucun fichier généré nouveau à persister."
          else
            git commit -m "chore: persister les 20 socles applicatifs [skip ci]"
            git push origin HEAD:main
          fi

  prompt-03-rls:
    name: Prompt 0.3 — policies RLS et scénarios d'isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: famille_prompt_03
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d famille_prompt_03"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: famille_prompt_03
    steps:
      - uses: actions/checkout@v4
      - name: Installer client PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase Auth local isolé
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/local-tests/0002_bootstrap_local_auth.sql
      - name: Appliquer le schéma commun en base éphémère
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/0001_famille_core_proposed.sql
      - name: Appliquer la migration candidate RLS 0002
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/0002_famille_core_rls.sql
      - name: Appliquer la candidate contextualisée 0003 (PostgreSQL éphémère uniquement)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/0003_prompt_0_3_contextual_rls.sql
      - name: Vérifier les claims app_id et le refus par défaut
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/local-tests/0003_prompt_0_3_context_assertions.sql
      - name: Rejouer la matrice complète après contextualisation (PostgreSQL 17)
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/local-tests/0002_prompt_0_3_rls_assertions.sql
