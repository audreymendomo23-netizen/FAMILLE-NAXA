name: ZIPPLE N1 — hosted smoke (no credentials)
on:
  push:
    branches: [main]
    paths:
      - "docs/apps/zipple/n1/hosted/hosted-smoke.test.mjs"
      - ".github/workflows/zipple-n1-hosted-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-negative-and-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test docs/apps/zipple/n1/hosted/hosted-smoke.test.mjs
