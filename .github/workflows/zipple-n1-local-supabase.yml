name: ZIPPLE N1 — real local Supabase
on:
  push:
    branches: [work/zipple-completion-20261126]
    paths:
      - "docs/apps/zipple/n1/backend/local*"
      - "docs/apps/zipple/n1/backend/schema.sql"
      - "docs/apps/zipple/n1/backend/adapter.mjs"
      - "docs/apps/zipple/n1/auth-boundary.mjs"
      - ".github/workflows/zipple-n1-local-supabase.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - uses: supabase/setup-cli@v3
        with:
          version: 2.75.0
      - name: Create disposable isolated Supabase project
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase init --help >/dev/null
          supabase start --help >/dev/null
          mkdir -p "$RUNNER_TEMP/zipple-local"
          cd "$RUNNER_TEMP/zipple-local"
          supabase init
          sed -i 's/^project_id = .*/project_id = "zipple-n1-ci"/' supabase/config.toml
          sed -i 's/^major_version = .*/major_version = 17/' supabase/config.toml
          # CLI 2.75.0 disables TOTP by default. Enable only in the disposable local project.
          python3 - <<'PY'
          from pathlib import Path
          import re, tomllib
          p = Path("supabase/config.toml")
          text = p.read_text()
          pattern = r"(?m)^\[auth\.mfa\.totp\]\s*\n(?:(?!^\[)[^\n]*\n)*"
          matches = list(re.finditer(pattern, text))
          if len(matches) != 1:
              raise SystemExit("Expected exactly one TOTP section in pinned CLI template")
          text = re.sub(pattern, "[auth.mfa.totp]\nenroll_enabled = true\nverify_enabled = true\n\n", text)
          cfg = tomllib.loads(text)
          assert cfg["auth"]["mfa"]["totp"]["enroll_enabled"] is True
          assert cfg["auth"]["mfa"]["totp"]["verify_enabled"] is True
          p.write_text(text)
          print("ZIPPLE_LOCAL_TOTP_CONFIG_ENABLED")
          PY
          cat >> supabase/config.toml <<'TOML'
          [functions.zipple-n1]
          verify_jwt = false
          TOML
          mkdir -p supabase/functions/zipple-n1
          cp "$GITHUB_WORKSPACE/docs/apps/zipple/n1/backend/local-index.ts" supabase/functions/zipple-n1/index.ts
          cp "$GITHUB_WORKSPACE/docs/apps/zipple/n1/backend/adapter.mjs" supabase/functions/zipple-n1/adapter.mjs
          cp "$GITHUB_WORKSPACE/docs/apps/zipple/n1/auth-boundary.mjs" supabase/functions/auth-boundary.mjs
          printf 'ZIPPLE_ALLOWED_ORIGINS=https://zipple.test\n' > supabase/functions/.env
          supabase start -x studio,imgproxy,inbucket,logflare,vector,supavisor
          supabase status -o env > "$RUNNER_TEMP/zipple-local.env"
          chmod 600 "$RUNNER_TEMP/zipple-local.env"
      - name: Apply draft only to local database
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/zipple-local.env"
          set +a
          case "$DB_URL" in *127.0.0.1*|*localhost*) ;; *) exit 1;; esac
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n1/backend/schema.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema'"
      - name: Prepare browser and temporary CI-only Android TLS trust
        run: |
          set -euo pipefail
          npm install --workspace @famille/zipple-web --workspace @famille/admin-console --include-workspace-root=false --ignore-scripts
          npm install --no-save --ignore-scripts pg@8.13.3 playwright@1.51.1
          npx playwright install --with-deps chromium
          VITE_ZIPPLE_API_URL=https://127.0.0.1:4443/gateway npm run build --workspace @famille/zipple-web
          # Public placeholder only; browser test transports calls exclusively to local GoTrue.
          VITE_ADMIN_SUPABASE_URL=https://idupfjbkwjcavyisxteo.supabase.co VITE_ADMIN_PUBLIC_KEY=sb_publishable_fixture node scripts/zipple/admin-cloudflare-build.mjs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=localhost" -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" -addext "basicConstraints=critical,CA:TRUE" -keyout "$RUNNER_TEMP/zipple-ci.key" -out "$RUNNER_TEMP/zipple-ci.crt" >/dev/null 2>&1
          # Only in the temporary CI checkout, never committed or packaged for release.
          mkdir -p apps/android/zipple/src/debug/res/raw apps/android/zipple/src/debug/res/xml
          cp "$RUNNER_TEMP/zipple-ci.crt" apps/android/zipple/src/debug/res/raw/zipple_ci_ca.pem
          cat > apps/android/zipple/src/debug/res/xml/zipple_ci_network.xml <<'XML'
          <network-security-config><domain-config cleartextTrafficPermitted="false"><domain includeSubdomains="false">127.0.0.1</domain><trust-anchors><certificates src="@raw/zipple_ci_ca"/><certificates src="system"/></trust-anchors></domain-config></network-security-config>
          XML
          cat > apps/android/zipple/src/debug/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:networkSecurityConfig="@xml/zipple_ci_network"/></manifest>
          XML
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Auth + REST + Edge + authenticated Web and Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash docs/apps/zipple/n1/backend/local-device.sh
      - name: Stop only local stack
        if: always()
        run: |
          cd "$RUNNER_TEMP/zipple-local"
          supabase stop --no-backup

# Revalidate actual MFA before deployment.
