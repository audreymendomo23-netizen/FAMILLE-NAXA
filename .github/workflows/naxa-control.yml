name: NAXA CONTROL — qualification candidate
on:
  push:
    branches: [work/naxa-control-20261128]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --workspace @famille/naxa-control --include-workspace-root=false --ignore-scripts
      - run: npm test --workspace @famille/naxa-control
      - run: npm run build --workspace @famille/naxa-control
  sql:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d control_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: control_test
    steps:
      - uses: actions/checkout@v4
      - run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/local-tests/0002_bootstrap_local_auth.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/0001_famille_core_proposed.sql
          psql -X -v ON_ERROR_STOP=1 -c 'create schema if not exists famille_private; create table famille_private.recovery_requests(id uuid,app_code text,channel text,status text,created_at timestamptz); create table famille_private.account_app_access(user_id uuid,app_code text,organization_id uuid,role_code text,location_id uuid,status text,starts_at timestamptz,ends_at timestamptz)'
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/naxa_control_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/local-tests/naxa_control_assertions.sql
