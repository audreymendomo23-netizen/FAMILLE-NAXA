name: NAXA SECURITY — responsive and native gate
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/naxa-security/**'
      - 'apps/android/naxa-security/**'
      - 'docs/naxa-security/contracts/**'
      - '.github/workflows/naxa-security-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test docs/naxa-security/contracts/navigation.test.mjs
      - run: npm install --workspace @famille/naxa-security-web --include-workspace-root=false --ignore-scripts
      - run: npm run build --workspace @famille/naxa-security-web
      - run: npm install --no-save --ignore-scripts playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          (cd apps/web/naxa-security && npx vite preview --host 127.0.0.1 --port 4173) >/tmp/security-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node docs/naxa-security/contracts/responsive.mjs
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle --no-daemon :naxa-security:assembleDebug :naxa-security:testDebugUnitTest
