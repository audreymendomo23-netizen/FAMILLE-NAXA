name: NAXA SERVICES — Android + Auth contract gate

on:
  push:
    branches:
      - work/naxa-services-completion-20261120
    paths:
      - "apps/android/naxa-services/**"
      - "packages/core-android/**"
      - "packages/billing-core/**"
      - "supabase/functions/naxa-services-auth/**"
      - "supabase/functions/naxa-services-referrals/**"
      - "supabase/drafts/naxa_services_v1.sql"
      - "supabase/drafts/naxa_services_v2_activity_onboarding_management.sql"
      - "supabase/drafts/naxa_services_referrals_v1.sql"
      - "supabase/drafts/naxa_services_v3_operations_rewards_sync.sql"
      - "supabase/drafts/naxa_services_v4_supplier_accounting_forecast.sql"
      - "supabase/tests/drafts/**"
      - "supabase/functions/naxa-services-accounting/**"
      - "supabase/config.toml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/naxa-services-technical-gate.yml"
  pull_request:
    paths:
      - "apps/android/naxa-services/**"
      - "packages/core-android/**"
      - "supabase/functions/naxa-services-auth/**"
      - "supabase/functions/naxa-services-referrals/**"
      - "supabase/drafts/naxa_services_v1.sql"
      - "supabase/drafts/naxa_services_v2_activity_onboarding_management.sql"
      - "supabase/drafts/naxa_services_referrals_v1.sql"
      - "supabase/drafts/naxa_services_v3_operations_rewards_sync.sql"
      - "supabase/drafts/naxa_services_v4_supplier_accounting_forecast.sql"
      - "supabase/tests/drafts/**"
      - "supabase/functions/naxa-services-accounting/**"
      - "supabase/config.toml"
      - "packages/billing-core/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/naxa-services-technical-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naxa-services-technical-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-contract:
    name: Auth scope and business-mode contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Auth gateway and contracts
        run: deno check supabase/functions/naxa-services-auth/index.ts supabase/functions/naxa-services-auth/scope_contract.ts supabase/functions/naxa-services-auth/contract_test.ts
      - name: Run pure Auth contract tests
        run: deno test supabase/functions/naxa-services-auth/contract_test.ts

  billing-catalog:
    name: NAXA FAMILY launch and maturity tariff tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test effective-dated family tariff catalogue
        run: node --test packages/billing-core/test/*.test.js

  referrals-contract:
    name: NAXA SERVICES referral API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check referral service and contracts
        run: deno check supabase/functions/naxa-services-referrals/index.ts supabase/functions/naxa-services-referrals/referral_contract.ts supabase/functions/naxa-services-referrals/contract_test.ts
      - name: Run referral contract tests
        run: deno test supabase/functions/naxa-services-referrals/contract_test.ts

  accounting-contract:
    name: NAXA SERVICES supplier accounting and forecast contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check accounting and stable-ID sync contracts
        run: deno check supabase/functions/naxa-services-accounting/index.ts supabase/functions/naxa-services-accounting/accounting_contract.ts supabase/functions/naxa-services-accounting/contract_test.ts supabase/functions/naxa-services-accounting/sync_contract.ts supabase/functions/naxa-services-accounting/sync_contract_test.ts
      - name: Run supplier accounting and forecast contracts
        run: deno test supabase/functions/naxa-services-accounting/contract_test.ts supabase/functions/naxa-services-accounting/sync_contract_test.ts

  sql-static-security:
    name: NAXA SERVICES draft SQL security boundary checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run static RLS, server-only grants and SECURITY DEFINER checks
        run: deno test --allow-read=supabase/drafts supabase/tests/drafts/naxa_services_static_security_test.ts

  android-debug:
    name: Assemble NAXA SERVICES Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          ls -l /dev/kvm
      - name: Verify activity photo folders and legal assets
        run: |
          for profile in pressing coiffure couture beaute parfumerie reparation menuiserie garage nettoyage domicile impression photo_evenementiel autre; do
            test -s "assets/naxa-services/activities/$profile/README.md"
          done
          for document in TERMS_OF_USE_2026-11-v1.md PRIVACY_POLICY_2026-11-v1.md TERMS_OF_USE_2026-11-v1_EN.md PRIVACY_POLICY_2026-11-v1_EN.md; do
            test -s "assets/naxa-services/legal/$document"
          done
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle compatible with Android Gradle Plugin 8.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 35 platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run NAXA SERVICES accounting and performance unit tests
        run: gradle --no-daemon :naxa-services:testDebugUnitTest
      - name: Run Android Keystore and local PIN integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-linux-hw-accel: false
          disable-animations: true
          script: gradle --no-daemon :naxa-services:connectedDebugAndroidTest
      - name: Compile and package NAXA SERVICES
        run: gradle --no-daemon :naxa-services:assembleDebug
      - name: Upload debug APK for technical review
        uses: actions/upload-artifact@v4
        with:
          name: naxa-services-debug-apk
          path: apps/android/naxa-services/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
