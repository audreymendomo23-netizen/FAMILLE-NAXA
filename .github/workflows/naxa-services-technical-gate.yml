name: NAXA SERVICES — Android + Auth contract gate

on:
  push:
    branches:
      - work/naxa-services-completion-20261120
    paths:
      - 'docs/naxa-services/NAXA_SERVICES_GLOBAL_QUALIFICATION_2026-11-27.json'
      - "assets/naxa-services/**"
      - "apps/android/naxa-services/**"
      - "apps/android/naxa-services-beneficiary/**"
      - "apps/web/naxa-services/**"
      - "packages/core-android/**"
      - "packages/billing-core/**"
      - "packages/finance-core/**"
      - "packages/offline-web/**"
      - "infra/backup/**"
      - "docs/naxa-services/NAXA_SERVICES_REMAINING_RED_GATES_2026-11-21.md"
      - "docs/naxa-services/NAXA_SERVICES_OUTBOX_REGISTRY_2026-11-22.*"
      - "scripts/naxa-services/**"
      - ".github/workflows/naxa-services-backup-restore.yml"
      - ".github/workflows/naxa-services-release.yml"
      - "packages/contracts/**"
      - "supabase/functions/naxa-services-auth/**"
      - "supabase/functions/naxa-services-referrals/**"
      - "supabase/functions/naxa-services-customer-promotions/**"
      - "supabase/functions/naxa-services-notifications/**"
      - "supabase/functions/naxa-services-meeting-media/**"
      - "supabase/functions/naxa-services-attendance-cleanup/**"
      - "supabase/drafts/naxa_services_v1.sql"
      - "supabase/drafts/naxa_services_v2_activity_onboarding_management.sql"
      - "supabase/drafts/naxa_services_referrals_v1.sql"
      - "supabase/drafts/naxa_services_v3_operations_rewards_sync.sql"
      - "supabase/drafts/naxa_services_v4_supplier_accounting_forecast.sql"
      - "supabase/drafts/naxa_services_v5_customer_referrals_promotions.sql"
      - "supabase/drafts/naxa_services_v6_notifications.sql"
      - "supabase/drafts/naxa_services_v7_financial_controls.sql"
      - "supabase/drafts/naxa_services_v8_subscription_payment.sql"
      - "supabase/tests/drafts/**"
      - "supabase/drafts/naxa_services_v9_*.sql"
      - "supabase/drafts/naxa_services_v[1-9][0-9]_*.sql"
      - "supabase/functions/naxa-services-accounting/**"
      - "supabase/config.toml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/naxa-services-technical-gate.yml"
      - ".github/workflows/naxa-services-replay-isolated.yml"
  pull_request:
    paths:
      - "apps/android/naxa-services/**"
      - "apps/android/naxa-services-beneficiary/**"
      - "apps/web/naxa-services/**"
      - "packages/core-android/**"
      - "supabase/functions/naxa-services-auth/**"
      - "supabase/functions/naxa-services-referrals/**"
      - "supabase/functions/naxa-services-customer-promotions/**"
      - "supabase/functions/naxa-services-notifications/**"
      - "supabase/functions/naxa-services-meeting-media/**"
      - "supabase/drafts/naxa_services_v1.sql"
      - "supabase/drafts/naxa_services_v2_activity_onboarding_management.sql"
      - "supabase/drafts/naxa_services_referrals_v1.sql"
      - "supabase/drafts/naxa_services_v3_operations_rewards_sync.sql"
      - "supabase/drafts/naxa_services_v4_supplier_accounting_forecast.sql"
      - "supabase/tests/drafts/**"
      - "supabase/drafts/naxa_services_v9_*.sql"
      - "supabase/drafts/naxa_services_v[1-9][0-9]_*.sql"
      - "supabase/functions/naxa-services-accounting/**"
      - "supabase/config.toml"
      - "packages/billing-core/**"
      - "packages/finance-core/**"
      - "packages/offline-web/**"
      - "infra/backup/**"
      - "docs/naxa-services/NAXA_SERVICES_REMAINING_RED_GATES_2026-11-21.md"
      - "docs/naxa-services/NAXA_SERVICES_OUTBOX_REGISTRY_2026-11-22.*"
      - "scripts/naxa-services/**"
      - ".github/workflows/naxa-services-backup-restore.yml"
      - ".github/workflows/naxa-services-release.yml"
      - "packages/contracts/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/naxa-services-technical-gate.yml"
      - ".github/workflows/naxa-services-replay-isolated.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naxa-services-technical-gate-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  auth-contract:
    name: Auth scope and business-mode contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Auth gateway and contracts
        run: deno check supabase/functions/naxa-services-auth/index.ts supabase/functions/naxa-services-auth/scope_contract.ts supabase/functions/naxa-services-auth/contract_test.ts
      - name: Run pure Auth contract tests
        run: deno test supabase/functions/naxa-services-auth/contract_test.ts supabase/functions/naxa-services-auth/subscription_credit_contract_test.ts

  naxa-services-web-build:
    name: NAXA SERVICES Web build
    # Playwright 1.56.1 does not support Ubuntu 26.04 yet; pin this browser job
    # to the supported 24.04 image. Other native/contract jobs keep ubuntu-latest.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Run Web authentication session tests
        run: npm test --workspace @famille/naxa-services-web
      - name: Build NAXA SERVICES Web
        run: npm run build --workspace @famille/naxa-services-web
      - name: Install Chromium browser test runner
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
          # GitHub-hosted Ubuntu includes Chromium system libraries; avoid unrelated apt repository failures.
          npx playwright install chromium
          node --input-type=module -e 'import { chromium } from "@playwright/test"; const browser=await chromium.launch({headless:true}); await browser.close();'
      - name: Run NAXA SERVICES Web and PWA browser E2E
        run: npx playwright test --config apps/web/naxa-services/playwright.config.ts
      - name: Upload NAXA SERVICES browser traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: naxa-services-web-browser-e2e
          path: apps/web/naxa-services/test-results/
          if-no-files-found: ignore

  sync-contract:
    name: Cross-application offline synchronization contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Verify NAXA SERVICES release configuration fails closed
        run: node --test scripts/naxa-services/release-config.test.mjs scripts/naxa-services/firebase-android-config.test.mjs
      - name: Validate cross-application sync envelope and conflict policies
        run: npm run test:contracts
      - name: Verify exact NAXA SERVICES outbox classification (N1)
        run: node scripts/naxa-services/verify-outbox-registry.mjs
      - name: Inventory commercial UI interactions and copy
        run: node scripts/naxa-services/audit-commercial-interactions.mjs
      - name: Verify consolidated residual qualification inventory
        run: node scripts/naxa-services/verify-global-qualification.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: naxa-services-commercial-interaction-inventory
          path: artifacts/naxa-services-commercial/
          if-no-files-found: error

  billing-catalog:
    name: NAXA FAMILY launch and maturity tariff tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Test effective-dated family tariff catalogue
        run: node --test packages/billing-core/test/*.test.js


  finance-policy:
    name: NAXA SERVICES payment, commission and fiscal policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Test provider confirmation, commissions and effective-dated fiscal rules
        run: npm test --workspace @famille/finance-core
      - name: Test offline Web/PWA queue policy
        run: npm test --workspace @famille/offline-web

  referrals-contract:
    name: NAXA SERVICES referral API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check referral service and contracts
        run: deno check supabase/functions/naxa-services-referrals/index.ts supabase/functions/naxa-services-referrals/referral_contract.ts supabase/functions/naxa-services-referrals/contract_test.ts
      - name: Run referral contract tests
        run: deno test supabase/functions/naxa-services-referrals/contract_test.ts

  notifications-contract:
    name: NAXA SERVICES remote notifications and FCM contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check notification registration, inbox and FCM worker
        run: deno check supabase/functions/naxa-services-notifications/index.ts supabase/functions/naxa-services-notifications/notification_contract.ts supabase/functions/naxa-services-notifications/contract_test.ts
      - name: Run notification token, payload and delivery-state tests
        run: deno test supabase/functions/naxa-services-notifications/contract_test.ts

  customer-promotions-contract:
    name: NAXA SERVICES customer referral and promotion contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check customer referral and promotion Edge gateway
        run: deno check supabase/functions/naxa-services-customer-promotions/index.ts supabase/functions/naxa-services-customer-promotions/promotion_contract.ts supabase/functions/naxa-services-customer-promotions/contract_test.ts
      - name: Run customer referral and promotion contract tests
        run: deno test supabase/functions/naxa-services-customer-promotions/contract_test.ts

  accounting-contract:
    name: NAXA SERVICES supplier accounting and forecast contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check accounting and stable-ID sync contracts
        run: deno check supabase/functions/naxa-services-accounting/index.ts supabase/functions/naxa-services-accounting/accounting_contract.ts supabase/functions/naxa-services-accounting/contract_test.ts supabase/functions/naxa-services-accounting/sync_contract.ts supabase/functions/naxa-services-accounting/sync_contract_test.ts
      - name: Run supplier accounting and forecast contracts
        run: deno test supabase/functions/naxa-services-accounting/contract_test.ts supabase/functions/naxa-services-accounting/sync_contract_test.ts

  sql-static-security:
    name: NAXA SERVICES draft SQL security boundary checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run static RLS, server-only grants and SECURITY DEFINER checks
        run: deno test --allow-read=supabase/drafts supabase/tests/drafts/naxa_services_static_security_test.ts

  meeting-media-contract:
    name: NAXA SERVICES media token security contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/naxa-services-meeting-media/contract_test.ts
      - run: deno test supabase/functions/naxa-services-attendance-cleanup/contract_test.ts

  postgres-rls-runtime:
    name: NAXA SERVICES PostgreSQL 17 schema and runtime RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: naxa_services_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d naxa_services_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: naxa_services_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          # Prefer the client already on the runner. Do not update unrelated vendor repositories.
          if ! command -v psql >/dev/null; then
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y postgresql-client
          fi
          psql --version
      - name: Bootstrap disposable Supabase Auth compatibility layer
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_postgres_bootstrap.sql
      - name: Apply candidate schemas to disposable PostgreSQL only
        shell: bash
        run: |
          set -euo pipefail
          for draft in \
            supabase/drafts/naxa_services_v1.sql \
            supabase/drafts/naxa_services_v2_activity_onboarding_management.sql \
            supabase/drafts/naxa_services_v3_operations_rewards_sync.sql \
            supabase/drafts/naxa_services_v4_supplier_accounting_forecast.sql \
            supabase/drafts/naxa_services_referrals_v1.sql \
            supabase/drafts/naxa_services_v5_customer_referrals_promotions.sql \
            supabase/drafts/naxa_services_v6_notifications.sql \
            supabase/drafts/naxa_services_v7_financial_controls.sql \
            supabase/drafts/naxa_services_v8_subscription_payment.sql; do
            echo "Applying disposable test copy of $draft"
            # Reject any candidate that would commit when run directly.
            test "$(tail -n 1 "$draft")" = "rollback;" || { echo "Unsafe candidate transaction: $draft" >&2; exit 1; }
            # The repository candidate files remain ROLLBACK-by-default.
            sed -E '$s/rollback;/commit/' "$draft" | psql -v ON_ERROR_STOP=1
          done
      - name: Execute tenant, site, device, payment and server-only RLS tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_rls_runtime_test.sql
      - name: Qualify strict activity field matrix without persistent schema change
        run: |
          { sed '$d' supabase/drafts/naxa_services_v20_activity_field_parity.sql; cat supabase/tests/drafts/naxa_services_activity_field_matrix.sql; echo 'rollback;'; } | psql -v ON_ERROR_STOP=1
      - name: Verify isolated subscription payment, paired proofs and replay
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_subscription_payment.sql
      - name: Verify strict management scope and unbound privileged RPC guards
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_strict_site_management_scope.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_unbound_session_guards.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_push_only_notifications.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_bound_push_tokens.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_notification_device_deliveries.sql

  android-debug:
    name: Assemble NAXA SERVICES Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          ls -l /dev/kvm
      - name: Verify activity photo folders and legal assets
        run: |
          for profile in pressing coiffure couture beaute parfumerie reparation menuiserie garage nettoyage domicile impression photo_evenementiel autre; do
            test -s "assets/naxa-services/activities/$profile/README.md"
          done
          for document in TERMS_OF_USE_2026-11-v1.md PRIVACY_POLICY_2026-11-v1.md TERMS_OF_USE_2026-11-v1_EN.md PRIVACY_POLICY_2026-11-v1_EN.md; do
            test -s "assets/naxa-services/legal/$document"
          done
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle compatible with Android Gradle Plugin 8.6.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android 35 platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run NAXA SERVICES accounting and performance unit tests
        run: gradle --no-daemon --stacktrace --info :naxa-services:testDebugUnitTest :naxa-services-beneficiary:testDebugUnitTest
      - name: Compile and package NAXA SERVICES
        id: assemble_debug_apk
        run: gradle --no-daemon :naxa-services:assembleDebug :naxa-services-beneficiary:assembleDebug
      - name: Run Android Keystore and local PIN integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-linux-hw-accel: false
          disable-animations: true
          script: gradle --no-daemon -PNS_ENABLE_BILLING_V23=true :naxa-services:connectedDebugAndroidTest
      - name: Upload debug APK for technical review
        if: ${{ always() && steps.assemble_debug_apk.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: naxa-services-debug-apk
          path: apps/android/naxa-services/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload isolated beneficiary debug APK for technical review
        if: ${{ always() && steps.assemble_debug_apk.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: naxa-services-beneficiary-debug-apk
          path: apps/android/naxa-services-beneficiary/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
