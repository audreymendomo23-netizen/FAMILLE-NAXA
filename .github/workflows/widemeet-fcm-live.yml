name: WideMeet — live FCM client qualification
on:
  push:
    branches: [work/widemeet-n0-20261126]
    paths: ['.github/workflows/widemeet-fcm-live.yml']
permissions:
  contents: read
jobs:
  chromium-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
      - run: google-chrome --version
      - run: VITE_WIDEMEET_PUSH_ENABLED=true npm run build --workspace @famille/widemeet-web
      - run: xvfb-run -a node scripts/widemeet/live-fcm-web.mjs
  android-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build real WideMeet with Firebase
        run: |
          set -euo pipefail
          if ! gradle --offline --no-daemon --max-workers=2 -PWM_PUSH_ENABLED=true :widemeet:assembleDebug :widemeet:assembleDebugAndroidTest; then
            for attempt in 1 2 3; do
              if [ "$attempt" -eq 2 ]; then export WM_CI_CENTRAL_ALTERNATE=true; else export WM_CI_CENTRAL_ALTERNATE=false; fi
              if gradle --no-daemon --max-workers=2 -PWM_PUSH_ENABLED=true :widemeet:assembleDebug :widemeet:assembleDebugAndroidTest; then exit 0; fi
              [ "$attempt" -lt 3 ] || exit 1
              sleep 15
            done
          fi
      - name: Enable KVM (family runner)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-linux-hw-accel: false
          script: bash scripts/widemeet/live-fcm-android.sh
