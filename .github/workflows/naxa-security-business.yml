name: NAXA SECURITY — business contracts B1–B6
on:
  push:
    branches: [main, 'work/naxa-security-completion-20261128']
    paths:
      - 'apps/web/naxa-security/**'
      - 'apps/android/naxa-security/**'
      - 'docs/naxa-security/contracts/**'
      - '.github/workflows/naxa-security-business.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  business:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        bulk: [B1,B2,B3,B4,B5,B6]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test docs/naxa-security/contracts/domain.test.mjs docs/naxa-security/contracts/module-workflows.test.mjs docs/naxa-security/contracts/execution-tools.test.mjs docs/naxa-security/contracts/preference-outbox.test.mjs docs/naxa-security/contracts/gateway-contract.test.mjs
        env:
          SECURITY_BULK: ${{ matrix.bulk }}
