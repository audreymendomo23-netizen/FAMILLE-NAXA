name: ZIPPLE N1 — isolated foundation
on:
  push:
    branches: [main]
    paths:
      - "docs/apps/zipple/n1/**"
      - ".github/workflows/zipple-n1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test docs/apps/zipple/n1/session.test.mjs
      - name: Build only ZIPPLE web
        run: |
          npm install --workspace @famille/zipple-web --include-workspace-root=false --ignore-scripts
          npm run build --workspace @famille/zipple-web
      - name: Verify ZIPPLE PWA assets
        run: |
          test -s apps/web/zipple/dist/manifest.webmanifest
          test -s apps/web/zipple/dist/sw.js
          test -s apps/web/zipple/dist/zipple-logo.jpg
          node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync("apps/web/zipple/dist/manifest.webmanifest"));if(m.theme_color!=="#0E224D"||m.display!=="standalone")process.exit(1)'
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build and unit-test ZIPPLE native only
        run: gradle --no-daemon :zipple:testDebugUnitTest :zipple:assembleDebug
      - name: Verify APK exists without publishing
        run: test -s apps/android/zipple/build/outputs/apk/debug/zipple-debug.apk
