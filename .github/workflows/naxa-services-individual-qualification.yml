name: NAXA SERVICES — 43 individual qualification criteria
on:
  workflow_dispatch:
  push:
    branches: [work/naxa-services-completion-20261120]
    paths:
      - '.github/workflows/naxa-services-individual-qualification.yml'
      - '.github/scripts/naxa-services/qualify-one.mjs'
      - 'docs/naxa-services/NAXA_SERVICES_GLOBAL_QUALIFICATION_2026-11-27.json'
      - 'docs/naxa-services/NAXA_SERVICES_EXECUTION_REGISTRY.json'
      - 'apps/android/naxa-services/**'
      - 'apps/android/naxa-services-beneficiary/**'
      - 'apps/web/naxa-services/**'
      - 'assets/naxa-services/**'
      - 'packages/core-android/**'
      - 'packages/core-web/**'
      - 'packages/contracts/**'
      - 'packages/billing-core/**'
      - 'packages/finance-core/**'
      - 'packages/offline-web/**'
      - 'packages/design-system/**'
      - 'supabase/functions/naxa-services-*/**'
      - 'supabase/drafts/naxa_services_*.sql'
      - 'supabase/tests/drafts/naxa_services_*.sql'
      - 'scripts/naxa-services/**'
      - '.github/scripts/naxa-services/**'
      - 'infra/backup/**'
      - 'supabase/config.toml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/naxa-services-technical-gate.yml'
      - '.github/workflows/naxa-services-replay-isolated.yml'
      - '.github/workflows/naxa-services-independent-reserves.yml'
      - '.github/workflows/naxa-services-backup-restore.yml'
      - '.github/workflows/naxa-services-cloudflare-preflight.yml'
      - '.github/workflows/naxa-services-hosted-device-test.yml'
      - '.github/workflows/naxa-services-release-readiness.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: ns-individual-qualification-${{ github.sha }}
  cancel-in-progress: false
jobs:
  collect:
    name: Collect exact candidate evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify qualification policy and execution inventory
        run: |
          node --test .github/scripts/naxa-services/qualification-status.test.mjs
          node scripts/naxa-services/audit-execution-registry.mjs
      - name: Collect only matching branch and SHA
        env:
          GH_TOKEN: ${{ github.token }}
          NS_COLLECT: 'true'
        run: node .github/scripts/naxa-services/qualify-one.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: exact-candidate-evidence
          path: artifacts/candidate-evidence/evidence.json
          if-no-files-found: error
  criterion:
    needs: collect
    name: ${{ matrix.criterion }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 43
      matrix:
        criterion: [B1-01, B1-02, B1-03, B1-04, B1-05, B1-06, B1-07, B2-01, B2-02, B2-03, B2-04, B2-05, B3-01, B3-02, B3-03, B3-04, B3-05, B3-06, B3-07, B3-08, B4-01, B4-02, B4-03, B4-04, B4-05, B4-06, B4-07, B5-01, B5-02, B5-03, B5-04, B5-05, B5-06, B5-07, B5-08, B5-09, B6-01, B6-02, B6-03, B6-04, B6-05, B6-06, B6-07]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v5
        with:
          name: exact-candidate-evidence
          path: artifacts/candidate-evidence
      - name: Execute isolated criterion and verify exact campaign evidence
        env:
          GH_TOKEN: ${{ github.token }}
          NS_CRITERION: ${{ matrix.criterion }}
        run: node .github/scripts/naxa-services/qualify-one.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qualification-${{ matrix.criterion }}
          path: artifacts/individual-qualification/${{ matrix.criterion }}.json
          if-no-files-found: error
          retention-days: 14
