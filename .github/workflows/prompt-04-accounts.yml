name: Famille NAXA — Prompt 0.4 comptes et appareils
on:
  push:
    branches: [main]
    paths:
      - "supabase/drafts/0004_prompt_0_4_account_lifecycle.sql"
      - "supabase/local-tests/0004_prompt_0_4_account_assertions.sql"
      - "supabase/functions/famille-account-lifecycle/**"
      - "deno.json"
      - "apps/web/admin-console/**"
      - "packages/core-android/**"
      - ".github/workflows/prompt-04-accounts.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: famille-prompt-04-accounts
  cancel-in-progress: true
jobs:
  postgres-17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: famille04
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d famille04"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Create local service role and bootstrap Auth
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d famille04 -v ON_ERROR_STOP=1 <<'SQL'
          create role service_role nologin bypassrls;
          SQL
          docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d famille04 -v ON_ERROR_STOP=1 < supabase/local-tests/0002_bootstrap_local_auth.sql
      - name: Apply isolated account lifecycle candidate
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d famille04 -v ON_ERROR_STOP=1 < supabase/drafts/0004_prompt_0_4_account_lifecycle.sql
      - name: Verify access, device limit, lockout and private grants
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d famille04 -v ON_ERROR_STOP=1 < supabase/local-tests/0004_prompt_0_4_account_assertions.sql
  edge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - run: deno test --allow-env supabase/functions/famille-account-lifecycle/index_test.ts
      - run: deno check supabase/functions/famille-account-lifecycle/index.ts
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build --workspace @famille/admin-console
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools,platforms;android-35,build-tools;35.0.0
      - run: chmod +x gradlew
      - run: ./gradlew :core-android:assembleDebug
