name: BOOTIK N0 isolated qualification
on:
  push:
    branches: [work/bootik-n0-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test docs/bootik-n0/policy.test.mjs docs/bootik-n0/bulk.test.mjs docs/bootik-n0/client.test.mjs
      - name: Isolated PostgreSQL draft qualification
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create schema auth; create table auth.users(id uuid primary key);'
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/drafts/bootik_v1.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/drafts/bootik_operations.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/drafts/bootik_auth.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f docs/bootik-n0/runtime-grants.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/drafts/bootik_payments.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f docs/bootik-n0/payment-grants.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f docs/bootik-n0/isolation.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f docs/bootik-n0/operations.sql
      - name: Real PostgreSQL API service recipe
        env:
          BOOTIK_TEST_ADMIN_URL: postgresql://postgres:test@localhost:5432/postgres
          BOOTIK_DATABASE_URL: postgresql://bootik_runtime:bootik-test-only@localhost:5432/postgres
          BOOTIK_TEST_PAYMENT_URL: postgresql://bootik_payment_runtime:bootik-payment-test-only@localhost:5432/postgres
        run: |
          npm install --prefix apps/server/bootik --workspaces=false --ignore-scripts --no-audit --no-fund
          node --test apps/server/bootik/service.test.mjs
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle --no-daemon :bootik:testDebugUnitTest :bootik:assembleDebug :bootik:assembleDebugAndroidTest
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --workspace @famille/bootik-web --include-workspace-root=false --ignore-scripts
      - run: npm run build --workspace @famille/bootik-web
  jobly-inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inventory source archive without executing it
        run: python3 docs/bootik-n0/jobly-inventory.py
  android-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: BOOTIK Android 35 instrumented recipe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle --no-daemon :bootik:connectedDebugAndroidTest
