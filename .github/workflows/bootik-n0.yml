name: BOOTIK N0 isolated qualification
on:
  push:
    branches: [work/bootik-n0-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test docs/bootik-n0/policy.test.mjs docs/bootik-n0/bulk.test.mjs docs/bootik-n0/client.test.mjs
      - name: Isolated PostgreSQL draft qualification
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated; create schema auth; create table auth.users(id uuid primary key);'
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/drafts/bootik_v1.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/drafts/bootik_operations.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/drafts/bootik_auth.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f docs/bootik-n0/runtime-grants.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/drafts/bootik_payments.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f docs/bootik-n0/payment-grants.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/drafts/bootik_stock_events.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f docs/bootik-n0/stock-event-grants.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f docs/bootik-n0/isolation.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f docs/bootik-n0/operations.sql
      - name: Real PostgreSQL API service recipe
        env:
          BOOTIK_TEST_ADMIN_URL: postgresql://postgres:test@localhost:5432/postgres
          BOOTIK_DATABASE_URL: postgresql://bootik_runtime:bootik-test-only@localhost:5432/postgres
          BOOTIK_SECURITY_DATABASE_URL: postgresql://bootik_security_runtime:bootik-security-test-only@localhost:5432/postgres
          BOOTIK_TEST_PAYMENT_URL: postgresql://bootik_payment_runtime:bootik-payment-test-only@localhost:5432/postgres
        run: |
          npm install --prefix apps/server/bootik --workspaces=false --ignore-scripts --no-audit --no-fund
          node --test apps/server/bootik/service.test.mjs
          node --experimental-strip-types --test apps/server/bootik/outbox.test.mjs
      - name: Real browser and PWA recipe with isolated PostgreSQL
        env:
          BOOTIK_TEST_ADMIN_URL: postgresql://postgres:test@localhost:5432/postgres
          BOOTIK_DATABASE_URL: postgresql://bootik_runtime:bootik-test-only@localhost:5432/postgres
          BOOTIK_SECURITY_DATABASE_URL: postgresql://bootik_security_runtime:bootik-security-test-only@localhost:5432/postgres
          BOOTIK_TEST_PAYMENT_URL: postgresql://bootik_payment_runtime:bootik-payment-test-only@localhost:5432/postgres
          VITE_BOOTIK_API_URL: https://127.0.0.1:8787
        run: |
          npm install --workspace @famille/bootik-web --include-workspace-root=false --ignore-scripts
          npm run build --workspace @famille/bootik-web
          apps/server/bootik/node_modules/.bin/playwright install --with-deps chromium
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=127.0.0.1' -keyout /tmp/bootik-test-key.pem -out /tmp/bootik-test-cert.pem >/dev/null 2>&1
          (cd apps/web/bootik && npx vite preview --host 127.0.0.1 --port 4173) >/tmp/bootik-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node --test apps/server/bootik/browser.test.mjs
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle --no-daemon :bootik:testDebugUnitTest :bootik:assembleDebug :bootik:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: bootik-debug-test-apks
          path: |
            apps/android/bootik/build/outputs/apk/debug/bootik-debug.apk
            apps/android/bootik/build/outputs/apk/androidTest/debug/bootik-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 2
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --workspace @famille/bootik-web --include-workspace-root=false --ignore-scripts
      - run: npm run build --workspace @famille/bootik-web
  jobly-inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inventory source archive without executing it
        run: python3 docs/bootik-n0/jobly-inventory.py
  android-device:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bootik-debug-test-apks
          path: /tmp/bootik-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute instrumented tests on the built APKs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            set -eu
            adb install -r "$(find /tmp/bootik-apks -name bootik-debug.apk -print -quit)"
            adb install -r -t "$(find /tmp/bootik-apks -name bootik-debug-androidTest.apk -print -quit)"
            adb shell am instrument -w -r cm.naxa.bootik.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/bootik-instrumentation.txt
            grep -Eq 'OK \([1-9][0-9]* tests?\)' /tmp/bootik-instrumentation.txt
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|shortMsg=' /tmp/bootik-instrumentation.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootik-instrumentation-report
          path: /tmp/bootik-instrumentation.txt
          if-no-files-found: warn
          retention-days: 2
