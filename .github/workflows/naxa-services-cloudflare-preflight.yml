name: NAXA SERVICES — Cloudflare Pages preflight (read only)
on:
  workflow_dispatch:
  push:
    branches: [work/naxa-services-completion-20261120]
    paths:
      - 'docs/naxa-services/NAXA_SERVICES_GLOBAL_QUALIFICATION_2026-11-27.json'
      - '.github/workflows/naxa-services-cloudflare-preflight.yml'
      - 'apps/web/naxa-services/**'
      - 'scripts/naxa-services/cloudflare-pages-build.mjs'
      - 'packages/core-web/**'
      - 'packages/contracts/**'
      - 'packages/offline-web/**'
      - 'packages/design-system/**'
      - 'docs/naxa-services/NAXA_SERVICES_EXECUTION_REGISTRY.json'
      - 'apps/android/naxa-services/**'
      - 'apps/android/naxa-services-beneficiary/**'
      - 'assets/naxa-services/**'
      - 'packages/core-android/**'
      - 'packages/billing-core/**'
      - 'packages/finance-core/**'
      - 'supabase/functions/naxa-services-*/**'
      - 'supabase/drafts/naxa_services_*.sql'
      - 'supabase/tests/drafts/naxa_services_*.sql'
      - 'scripts/naxa-services/**'
      - '.github/scripts/naxa-services/**'
      - 'infra/backup/**'
      - 'supabase/config.toml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/naxa-services-technical-gate.yml'
      - '.github/workflows/naxa-services-replay-isolated.yml'
      - '.github/workflows/naxa-services-independent-reserves.yml'
      - '.github/workflows/naxa-services-backup-restore.yml'
      - '.github/workflows/naxa-services-hosted-device-test.yml'
      - '.github/workflows/naxa-services-release-readiness.yml'
      - '.github/workflows/naxa-services-individual-qualification.yml'
permissions:
  contents: read
  checks: read
jobs:
  production-web-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Build dedicated Web/PWA candidate
        env:
          VITE_NAXA_SERVICES_AUTH_URL: https://idupfjbkwjcavyisxteo.supabase.co/functions/v1/naxa-services-auth
          VITE_NAXA_SERVICES_ACCOUNTING_URL: https://idupfjbkwjcavyisxteo.supabase.co/functions/v1/naxa-services-accounting
          VITE_SUPABASE_ANON_KEY: ${{ secrets.NAXA_SERVICES_SUPABASE_ANON_KEY }}
        run: node scripts/naxa-services/cloudflare-pages-build.mjs
      - name: Validate static deployment output
        run: |
          cd apps/web/naxa-services/dist
          test -s index.html
          test -s sw.js
          test -s manifest.webmanifest
          test -s naxa-services-icon.svg
          test -d assets
          test -d media
          grep -rlF 'https://idupfjbkwjcavyisxteo.supabase.co/functions/v1/naxa-services-auth' assets/ >/dev/null
          echo 'Dedicated static artifact with production Auth URL: validated.'
      - uses: actions/upload-artifact@v6
        with:
          name: naxa-services-cloudflare-candidate
          path: apps/web/naxa-services/dist/
          if-no-files-found: error
  cloudflare-live-match:
    needs: production-web-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: naxa-services-cloudflare-candidate
          path: candidate
      - name: Wait for the Cloudflare deployment of this exact commit
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 42); do
            result="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" --jq '.check_runs | map(select(.app.id == 85455 and .app.slug == "cloudflare-workers-and-pages" and .name == "Cloudflare Pages: famille-naxa")) | sort_by(.id) | last // {}')"
            state="$(jq -r '.status // "pending"' <<< "$result")"
            if [[ "$state" == completed ]]; then
              [[ "$(jq -r '.conclusion' <<< "$result")" == success ]] || { echo 'Cloudflare deployment failed'; exit 1; }
              [[ "$(jq -r '.head_sha' <<< "$result")" == "$GITHUB_SHA" ]] || { echo 'Unexpected commit'; exit 1; }
              origin="$(jq -r '.output.summary' <<< "$result" | grep -oE 'https://[0-9a-f]{8}\.famille-naxa\.pages\.dev' | head -1)"
              [[ "$origin" =~ ^https://[0-9a-f]{8}\.famille-naxa\.pages\.dev$ ]] || { echo 'No verified preview URL'; exit 1; }
              echo "origin=$origin" >> "$GITHUB_OUTPUT"
              echo "Verified Cloudflare deploy for $GITHUB_SHA: $origin"
              exit 0
            fi
            echo "Waiting for Cloudflare check: $attempt/42"
            sleep 10
          done
          echo 'Cloudflare deployment did not complete within the verification window'
          exit 1
      - name: Verify published files against exact build candidate (read only)
        env:
          VERIFIED_ORIGIN: ${{ steps.pages.outputs.origin }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cd candidate
          failed=0
          while IFS= read -r -d '' file; do
            request_path="/${file#./}"
            [[ "$request_path" != /index.html ]] || request_path=/
            if ! curl --silent --show-error --fail --location --proto-redir '=https' --max-redirs 3 --retry 2 --max-time 30 -H 'Cache-Control: no-cache' "$VERIFIED_ORIGIN$request_path" -o "$tmp/remote"; then
              echo "Missing published file: $file"; failed=1; continue
            fi
            if ! cmp -s "$file" "$tmp/remote"; then
              echo "Published file differs: $file"
              sha256sum "$file" "$tmp/remote" | cut -d' ' -f1
              failed=1
            fi
          done < <(find . -type f -print0)
          [[ "$failed" == 0 ]] || exit 1
          echo 'All files in the exact candidate match the immutable deployment URL.'
      - name: Verify stable Pages alias (read only)
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cd candidate
          for file in index.html manifest.webmanifest sw.js; do
            request_path="/$file"
            [[ "$request_path" != /index.html ]] || request_path=/
            curl --silent --show-error --fail --location --proto-redir '=https' --max-redirs 3 --retry 2 --max-time 30 -H 'Cache-Control: no-cache' "https://famille-naxa.pages.dev$request_path" -o "$tmp/remote"
            cmp -s "$file" "$tmp/remote" || { echo "Stable alias differs: $file (may be a newer deployment)"; exit 1; }
          done
          echo 'Stable Pages alias matches candidate shell.'
  hosted-edge-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Check five live Edge gateways without mutation
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          origin = 'https://famille-naxa.pages.dev'
          foreign = 'https://untrusted.invalid'
          base = 'https://idupfjbkwjcavyisxteo.supabase.co/functions/v1/'
          failed = False
          for name in ['auth', 'accounting', 'referrals', 'customer-promotions', 'notifications']:
              for request_origin in [origin, foreign]:
                  req = urllib.request.Request(base + 'naxa-services-' + name, method='OPTIONS', headers={
                      'Origin': request_origin, 'Access-Control-Request-Method': 'POST',
                      'Access-Control-Request-Headers': 'authorization,apikey,content-type',
                  })
                  try:
                      response = urllib.request.urlopen(req, timeout=20)
                  except urllib.error.HTTPError as exc:
                      response = exc
                  with response:
                      status, allowed = response.status, response.headers.get('Access-Control-Allow-Origin')
                      methods = response.headers.get('Access-Control-Allow-Methods', '')
                      headers = response.headers.get('Access-Control-Allow-Headers', '').lower()
                      good = status in (200, 204) and 'POST' in methods and all(h in headers for h in ['authorization','apikey','content-type']) and (allowed == origin if request_origin == origin else allowed in (None, 'null'))
                      print(f'{name}: {"official" if request_origin == origin else "foreign"} status={status} allow={allowed} {"PASS" if good else "FAIL"}', flush=True)
                      failed |= not good
          if failed: raise SystemExit(1)
          PY
