name: NAXA SERVICES — Cloudflare Pages preflight (read only)
on:
  workflow_dispatch:
  push:
    branches: [work/naxa-services-completion-20261120]
    paths:
      - '.github/workflows/naxa-services-cloudflare-preflight.yml'
permissions:
  contents: read
jobs:
  production-web-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Build dedicated Web/PWA candidate
        env:
          VITE_NAXA_SERVICES_AUTH_URL: https://idupfjbkwjcavyisxteo.supabase.co/functions/v1/naxa-services-auth
          VITE_NAXA_SERVICES_ACCOUNTING_URL: https://idupfjbkwjcavyisxteo.supabase.co/functions/v1/naxa-services-accounting
          VITE_SUPABASE_ANON_KEY: ${{ secrets.NAXA_SERVICES_SUPABASE_ANON_KEY }}
        run: node scripts/naxa-services/cloudflare-pages-build.mjs
      - name: Validate static deployment output
        run: |
          cd apps/web/naxa-services/dist
          test -s index.html
          test -s sw.js
          test -s manifest.webmanifest
          test -s naxa-services-icon.svg
          test -d assets
          test -d media
          grep -rlF 'https://idupfjbkwjcavyisxteo.supabase.co/functions/v1/naxa-services-auth' assets/ >/dev/null
          echo 'Dedicated static artifact with production Auth URL: validated.'
      - uses: actions/upload-artifact@v4
        with:
          name: naxa-services-cloudflare-candidate
          path: apps/web/naxa-services/dist/
          if-no-files-found: error
  cloudflare-live-match:
    needs: production-web-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: naxa-services-cloudflare-candidate
          path: candidate
      - name: Verify public Pages files against exact build candidate (read only)
        shell: bash
        run: |
          set -euo pipefail
          origin='https://famille-naxa.pages.dev'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cd candidate
          for file in index.html manifest.webmanifest sw.js; do
            curl --silent --show-error --fail --max-time 30 -H 'Cache-Control: no-cache' "$origin/$file" -o "$tmp/remote"
            cmp -s "$file" "$tmp/remote" || { echo "Live file differs from candidate: $file"; exit 1; }
          done
          while IFS= read -r -d '' file; do
            curl --silent --show-error --fail --max-time 30 -H 'Cache-Control: no-cache' "$origin/$file" -o "$tmp/remote"
            cmp -s "$file" "$tmp/remote" || { echo "Live asset differs from candidate: $file"; exit 1; }
          done < <(find assets -type f -print0)
          echo 'Live HTML, PWA files and compiled assets match this exact candidate. This is not a customer acceptance test or proof of a Cloudflare deployment ID.'
