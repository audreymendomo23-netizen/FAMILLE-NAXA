name: NAXA SERVICES — Cloudflare Pages preflight (read only)
on:
  workflow_dispatch:
  push:
    branches: [work/naxa-services-completion-20261120]
    paths:
      - '.github/workflows/naxa-services-cloudflare-preflight.yml'
permissions:
  contents: read
jobs:
  production-web-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public client configuration
        env:
          VITE_SUPABASE_ANON_KEY: ${{ secrets.NAXA_SERVICES_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const k=process.env.VITE_SUPABASE_ANON_KEY || '';
          let valid=k.startsWith('sb_publishable_');
          if(!valid) {
            try { const p=JSON.parse(Buffer.from(k.split('.')[1],'base64url').toString()); valid=p.role==='anon' && p.ref==='idupfjbkwjcavyisxteo'; } catch {}
          }
          if(!valid) { console.error('Missing or invalid public Supabase key; never use service role'); process.exit(1); }
          console.log('Public client key validated (role/ref checked for legacy JWT).');
          NODE
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Build dedicated Web/PWA candidate
        env:
          VITE_NAXA_SERVICES_AUTH_URL: https://idupfjbkwjcavyisxteo.supabase.co/functions/v1/naxa-services-auth
          VITE_NAXA_SERVICES_ACCOUNTING_URL: https://idupfjbkwjcavyisxteo.supabase.co/functions/v1/naxa-services-accounting
          VITE_SUPABASE_ANON_KEY: ${{ secrets.NAXA_SERVICES_SUPABASE_ANON_KEY }}
        run: npm run build --workspace @famille/naxa-services-web
      - name: Validate static deployment output
        run: |
          cd apps/web/naxa-services/dist
          test -s index.html
          test -s sw.js
          test -s manifest.webmanifest
          test -s naxa-services-icon.svg
          test -d assets
          test -d media
          grep -rlF 'https://idupfjbkwjcavyisxteo.supabase.co/functions/v1/naxa-services-auth' assets/ >/dev/null
          echo 'Dedicated static artifact with production Auth URL: validated.'
      - uses: actions/upload-artifact@v4
        with:
          name: naxa-services-cloudflare-candidate
          path: apps/web/naxa-services/dist/
          if-no-files-found: error
  cloudflare-project-access:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify dedicated Pages project using GET only
        env:
          CF_ACCOUNT: ${{ vars.NAXA_SERVICES_CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.NAXA_SERVICES_CLOUDFLARE_PAGES_PROJECT }}
          CF_TOKEN: ${{ secrets.NAXA_SERVICES_CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -eu
          [[ "$CF_ACCOUNT" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'Missing or invalid NAXA SERVICES Cloudflare account ID'; exit 1; }
          [[ "$CF_PROJECT" =~ ^naxa-services(-[a-z0-9-]+)?$ ]] || { echo 'Missing or non-dedicated Pages project name'; exit 1; }
          [[ -n "$CF_TOKEN" ]] || { echo 'Missing dedicated Cloudflare API token'; exit 1; }
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          status="$(curl --silent --show-error --max-time 30 --output "$response" --write-out '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$CF_PROJECT")"
          [[ "$status" == 200 ]] || { echo "Cloudflare project lookup HTTP $status"; exit 1; }
          jq -e --arg expected "$CF_PROJECT" '.success == true and .result.name == $expected' "$response" >/dev/null
          echo 'Dedicated Pages project is reachable. No deployment or project mutation performed.'
