name: ZIPPLE business — real local Supabase
on:
  push:
    branches: [work/zipple-completion-20261126]
    paths:
      - "docs/apps/zipple/n2-n5/**"
      - "apps/web/zipple/src/business/**"
      - "apps/android/zipple/**"
      - ".github/workflows/zipple-business-local.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-business:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: supabase/setup-cli@v3
        with:
          version: 2.75.0
      - name: Reuse N1 local GoTrue, PostgreSQL and Edge recipe
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zipple-business-local"
          cd "$RUNNER_TEMP/zipple-business-local"
          supabase init
          sed -i 's/^project_id = .*/project_id = "zipple-business-ci"/' supabase/config.toml
          sed -i 's/^major_version = .*/major_version = 17/' supabase/config.toml
          cat >> supabase/config.toml <<'TOML'
          [functions.zipple-n1]
          verify_jwt = false
          [functions.zipple-business]
          verify_jwt = false
          TOML
          mkdir -p supabase/functions/zipple-n1 supabase/functions/zipple-business
          cp "$GITHUB_WORKSPACE/docs/apps/zipple/n1/backend/local-index.ts" supabase/functions/zipple-n1/index.ts
          cp "$GITHUB_WORKSPACE/docs/apps/zipple/n1/backend/adapter.mjs" supabase/functions/zipple-n1/adapter.mjs
          cp "$GITHUB_WORKSPACE/docs/apps/zipple/n1/auth-boundary.mjs" supabase/functions/auth-boundary.mjs
          cp "$GITHUB_WORKSPACE/docs/apps/zipple/n2-n5/local-index.ts" supabase/functions/zipple-business/index.ts
          cp "$GITHUB_WORKSPACE/docs/apps/zipple/n2-n5/business-gateway.mjs" supabase/functions/zipple-business/business-gateway.mjs
          printf 'ZIPPLE_ALLOWED_ORIGINS=https://zipple.test\nZIPPLE_BUSINESS_DISPOSABLE=1\n' > supabase/functions/.env
          supabase start -x studio,imgproxy,inbucket,logflare,vector,supavisor
          supabase status -o env > "$RUNNER_TEMP/zipple-business.env"
          chmod 600 "$RUNNER_TEMP/zipple-business.env"
      - name: Apply business schema only to loopback database
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/zipple-business.env"
          set +a
          case "$DB_URL" in *127.0.0.1*|*localhost*) ;; *) exit 1;; esac
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n1/backend/schema.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/schema.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/operations.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/inventory-finance.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/procurement.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/customer-service.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/transfers.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/containers.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/pilotage.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk1-boundary.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk2-core.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk2-formulas.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk2-group-pay.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk2-choices-pricing.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk2-queue.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk2-operational-roles.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-cash.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-prepared-transfer.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-ledger.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-credit.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-braise.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-offline.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-documents.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-ledger-split.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-outflows.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-expiry.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-inventory-gains.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-direct-sale.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-financial-statements.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-weighted-preparation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-treasury-reconciliation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-commercial-notes.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-intermediates.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-purchase-consolidation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-controls.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-supplier-returns.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk3-tax.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk4-5-workspaces.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk4-commerce.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f docs/apps/zipple/n2-n5/bulk5-hr.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema'"
      - name: Prepare Web and isolated Edge test environment
        id: web_setup
        run: |
          set -euo pipefail
          npm install --workspace @famille/zipple-web --include-workspace-root=false --ignore-scripts
          npm install --no-save --ignore-scripts pg@8.13.3 playwright@1.51.1
          npx playwright install --with-deps chromium
          VITE_ZIPPLE_API_URL=https://127.0.0.1:4443/gateway VITE_ZIPPLE_BUSINESS_API_URL=https://idupfjbkwjcavyisxteo.supabase.co/functions/v1/zipple-business npm run build --workspace @famille/zipple-web
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=localhost" -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" -addext "basicConstraints=critical,CA:TRUE" -keyout "$RUNNER_TEMP/zipple-ci.key" -out "$RUNNER_TEMP/zipple-ci.crt" >/dev/null 2>&1
      - name: Qualify real business UI via isolated Edge
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/zipple-business.env"
          set +a
          export ZIPPLE_TLS_KEY="$RUNNER_TEMP/zipple-ci.key" ZIPPLE_TLS_CERT="$RUNNER_TEMP/zipple-ci.crt"
          status=0
          node --test docs/apps/zipple/n2-n5/local-workspaces.test.mjs || status=$?
          node --test docs/apps/zipple/n2-n5/local-business.test.mjs || status=$?
          exit "$status"
      - name: Prepare isolated Android TLS trust
        id: native_tls
        if: ${{ !cancelled() && steps.web_setup.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p apps/android/zipple/src/debug/res/raw apps/android/zipple/src/debug/res/xml
          cp "$RUNNER_TEMP/zipple-ci.crt" apps/android/zipple/src/debug/res/raw/zipple_ci_ca.pem
          cat > apps/android/zipple/src/debug/res/xml/zipple_ci_network.xml <<'XML'
          <network-security-config><domain-config cleartextTrafficPermitted="false"><domain includeSubdomains="false">127.0.0.1</domain><trust-anchors><certificates src="@raw/zipple_ci_ca"/><certificates src="system"/></trust-anchors></domain-config></network-security-config>
          XML
          cat > apps/android/zipple/src/debug/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:networkSecurityConfig="@xml/zipple_ci_network"/></manifest>
          XML
      - name: Enable KVM for business recipe
        id: native_kvm
        if: ${{ !cancelled() && steps.native_tls.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android 35 — actual local GoTrue, Edge and split payment
        if: ${{ !cancelled() && steps.native_kvm.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash docs/apps/zipple/n2-n5/local-business-device.sh
      - name: Preserve workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zipple-workspace-screenshots
          path: ${{ runner.temp }}/zipple-workspace-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve native test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zipple-native-bulk2-reports
          path: |
            apps/android/zipple/build/outputs/androidTest-results/connected/
            apps/android/zipple/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 7
      - name: Stop disposable stack
        if: always()
        run: |
          cd "$RUNNER_TEMP/zipple-business-local"
          supabase stop --no-backup
