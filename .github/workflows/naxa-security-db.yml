name: NAXA SECURITY — isolated database contract
on:
  push:
    branches: [main, 'work/naxa-security-completion-20261128']
    paths:
      - 'docs/naxa-security/contracts/**'
      - '.github/workflows/naxa-security-db.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sql:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: security_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: security_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: psql -v ON_ERROR_STOP=1 -f docs/naxa-security/contracts/db-fixture.sql -f docs/naxa-security/contracts/backend-candidate.sql -f docs/naxa-security/contracts/backend-assertions.sql -f docs/naxa-security/contracts/operations-candidate.sql -f docs/naxa-security/contracts/operations-assertions.sql -f docs/naxa-security/contracts/attendance-candidate.sql -f docs/naxa-security/contracts/attendance-assertions.sql -f docs/naxa-security/contracts/module-requests-candidate.sql -f docs/naxa-security/contracts/module-requests-assertions.sql -f docs/naxa-security/contracts/module-review-candidate.sql -f docs/naxa-security/contracts/module-review-assertions.sql -f docs/naxa-security/contracts/service-execution-candidate.sql -f docs/naxa-security/contracts/service-execution-assertions.sql -f docs/naxa-security/contracts/integration-boundary-candidate.sql -f docs/naxa-security/contracts/integration-boundary-assertions.sql -f docs/naxa-security/contracts/field-operations-candidate.sql -f docs/naxa-security/contracts/field-operations-assertions.sql -f docs/naxa-security/contracts/gateway-ingest-candidate.sql -f docs/naxa-security/contracts/gateway-ingest-assertions.sql -f docs/naxa-security/contracts/trust-services-candidate.sql -f docs/naxa-security/contracts/trust-services-assertions.sql -f docs/naxa-security/contracts/safety-source-candidate.sql -f docs/naxa-security/contracts/safety-source-assertions.sql -f docs/naxa-security/contracts/media-issue-candidate.sql -f docs/naxa-security/contracts/media-issue-assertions.sql -f docs/naxa-security/contracts/diagnostic-correlation-candidate.sql -f docs/naxa-security/contracts/diagnostic-correlation-assertions.sql -f docs/naxa-security/contracts/livecare-candidate.sql -f docs/naxa-security/contracts/livecare-assertions.sql -f docs/naxa-security/contracts/case-report-candidate.sql -f docs/naxa-security/contracts/case-report-assertions.sql -f docs/naxa-security/contracts/erp-execution-candidate.sql -f docs/naxa-security/contracts/erp-execution-assertions.sql -f docs/naxa-security/contracts/visitor-pass-candidate.sql -f docs/naxa-security/contracts/visitor-pass-assertions.sql -f docs/naxa-security/contracts/audit-timeline-candidate.sql -f docs/naxa-security/contracts/audit-timeline-assertions.sql -f docs/naxa-security/contracts/activity-notifications-candidate.sql -f docs/naxa-security/contracts/activity-notifications-assertions.sql -f docs/naxa-security/contracts/extended-report-candidate.sql -f docs/naxa-security/contracts/extended-report-assertions.sql -f docs/naxa-security/contracts/audit-page-candidate.sql -f docs/naxa-security/contracts/audit-access-candidate.sql -f docs/naxa-security/contracts/audit-export-candidate.sql -f docs/naxa-security/contracts/audit-page-assertions.sql -f docs/naxa-security/contracts/audit-access-assertions.sql -f docs/naxa-security/contracts/audit-retention-candidate.sql -f docs/naxa-security/contracts/audit-retention-assertions.sql -f docs/naxa-security/contracts/business-catalog-candidate.sql -f docs/naxa-security/contracts/business-catalog-assertions.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: psql -v ON_ERROR_STOP=1 -f docs/naxa-security/contracts/browser-db-fixture.sql
      - run: npm install --workspace @famille/naxa-security-web --include-workspace-root=false --ignore-scripts
      - run: npm run build --workspace @famille/naxa-security-web
        env:
          VITE_SECURITY_PUBLISHABLE_KEY: sb_publishable_qa_fixture_not_a_real_key
          VITE_SECURITY_MODULE_REQUESTS_ENABLED: 'true'
          VITE_SECURITY_TRUST_ENABLED: 'true'
          VITE_SECURITY_FIELD_ENABLED: 'true'
      - run: npm install --no-save --ignore-scripts playwright@1.65.1
      - run: npx playwright install --with-deps chromium
      - run: |
          (cd apps/web/naxa-security && npx vite preview --host 127.0.0.1 --port 4173) >/tmp/security-db-browser.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node docs/naxa-security/contracts/browser-db-livecare.mjs
        env:
          SECURITY_DB_E2E: '1'
