name: NAXA SERVICES — hosted Android acceptance APK
on:
  workflow_dispatch:
  push:
    branches: [work/naxa-services-completion-20261120]
    paths:
      - 'docs/naxa-services/NAXA_SERVICES_GLOBAL_QUALIFICATION_2026-11-27.json'
      - '.github/workflows/naxa-services-hosted-device-test.yml'
      - 'apps/android/naxa-services/**'
      - 'scripts/naxa-services/release-config.mjs'
permissions:
  contents: read
concurrency:
  group: ns-hosted-acceptance-${{ github.sha }}
  cancel-in-progress: false
jobs:
  hosted-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate dedicated public backend and Android configuration
        env:
          NS_PROJECT_REF: idupfjbkwjcavyisxteo
          NS_ANON_KEY: ${{ secrets.NAXA_SERVICES_SUPABASE_ANON_KEY }}
          NS_FIREBASE_API_KEY: ${{ vars.NAXA_SERVICES_FIREBASE_API_KEY }}
          NS_FIREBASE_APP_ID: '1:203144467053:android:35b6db66aa6a85bce1e564'
          NS_FIREBASE_PROJECT_ID: naxa-services
          NS_FIREBASE_SENDER_ID: '203144467053'
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { validateReleaseConfig } from './scripts/naxa-services/release-config.mjs';
          const config = {...validateReleaseConfig(process.env), NS_ENABLE_ROSTER:'true', NS_ENABLE_BRIEFING:'true', NS_ENABLE_MEETINGS:'true', NS_ENABLE_ATTENDANCE:'true'};
          for(const [name,value] of Object.entries(config)){
            if(/[\r\n]/.test(value))throw Error('Invalid multiline configuration');
            appendFileSync(process.env.GITHUB_ENV,'ORG_GRADLE_PROJECT_'+name+'='+value+'\n');
          }
          NODE
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build hosted debug candidate, never commercial release
        run: gradle --no-daemon :naxa-services:assembleDebug
      - name: Verify APK and create handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hosted-acceptance"
          apk="$(find apps/android/naxa-services/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          cp "$apk" "$RUNNER_TEMP/hosted-acceptance/naxa-services-hosted-test.apk"
          cd "$RUNNER_TEMP/hosted-acceptance"
          sha256sum naxa-services-hosted-test.apk > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
          printf '%s\n' 'Owner acceptance only. Debug signature; not a commercial APK. Requires an authorized test account. No real payment or live media qualification.' > README.txt
      - uses: actions/upload-artifact@v6
        with:
          name: naxa-services-hosted-test-apk
          path: ${{ runner.temp }}/hosted-acceptance/
          if-no-files-found: error
          retention-days: 7
