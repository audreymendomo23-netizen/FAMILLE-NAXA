name: Family media — isolated SFU replay
on:
  pull_request:
    branches: [test/widemeet-qualification-20261126]
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/media-core/**'
      - 'scripts/widemeet/media-replay.mjs'
      - 'scripts/widemeet/media-product-replay.mjs'
      - 'supabase/functions/widemeet-room/**'
      - '.github/workflows/family-media-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned test dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund livekit-client@2.25.0 livekit-server-sdk@2.20.1 ws@8.18.3 @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Start disposable SFU bound to loopback
        run: |
          set -euo pipefail
          KEY="naxareplay"
          SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$SECRET"
          echo "LK_TEST_KEY=$KEY" >> "$GITHUB_ENV"
          echo "LK_TEST_SECRET=$SECRET" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/lk.yaml" <<EOF
          port: 7880
          bind_addresses: ["127.0.0.1"]
          rtc:
            node_ip: 127.0.0.1
            use_external_ip: false
            tcp_port: 7882
            udp_port: 7883
          room:
            auto_create: false
            enable_remote_unmute: false
          keys:
            $KEY: $SECRET
          EOF
          chmod 600 "$RUNNER_TEMP/lk.yaml"
          docker run -d --name naxa-lk --network host -v "$RUNNER_TEMP/lk.yaml:/etc/livekit.yaml:ro" livekit/livekit-server:v1.13.8 --config /etc/livekit.yaml
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:7880/ >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs naxa-lk
          exit 1
      - name: Exercise actual SFU with two browser sessions and revoked token
        run: node scripts/widemeet/media-replay.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Start disposable product database and install exact schema
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wm-media-db"
          cd "$RUNNER_TEMP/wm-media-db"
          supabase init
          supabase start
          supabase status -o env > "$RUNNER_TEMP/wm-media.env"
          chmod 600 "$RUNNER_TEMP/wm-media.env"
          set -a; source "$RUNNER_TEMP/wm-media.env"; set +a
          [[ "$API_URL" == http://127.0.0.1:54321 ]] || exit 1
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/drafts/widemeet_n1_identity.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/drafts/widemeet_n2_n3_rooms.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/drafts/widemeet_n1_billing.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/drafts/widemeet_n2_external.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/drafts/widemeet_n4_minutes.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/drafts/widemeet_n4_presence.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "notify pgrst, 'reload schema'"
      - name: Exercise real product sessions and database-driven SFU eviction
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/wm-media.env"; set +a
          [[ "$API_URL" == http://127.0.0.1:54321 ]] || exit 1
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export WM_AUTH_QUALIFIED=true WM_ROOM_QUALIFIED=true WM_PRESENCE_QUALIFIED=true WM_EXTERNAL_GUESTS_QUALIFIED=true WM_MEDIA_QUALIFIED=true WM_ALLOWED_ORIGINS=http://127.0.0.1:4173
          export WM_LIVEKIT_URL=wss://127.0.0.1:7881 WM_LIVEKIT_API_KEY="$LK_TEST_KEY" WM_LIVEKIT_API_SECRET="$LK_TEST_SECRET"
          node scripts/widemeet/media-product-replay.mjs
      - name: Stop disposable product database
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/wm-media-db"; then cd "$RUNNER_TEMP/wm-media-db" && supabase stop --no-backup; fi
      - name: Cleanup
        if: always()
        run: docker rm -f naxa-lk || true
