name: GRILLAD — construction locale et qualification
on:
  push:
    branches: [work/grillad-foundation-20261127]
    paths:
      - 'apps/android/grillad/**'
      - 'apps/web/grillad/**'
      - 'scripts/grillad/**'
      - 'supabase/functions/grillad/**'
      - 'supabase/drafts/grillad*.sql'
      - 'supabase/local-tests/grillad*.sql'
      - '.github/workflows/grillad-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/grillad/infrastructure.test.mjs supabase/functions/grillad/handler.test.mjs
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --workspace @famille/grillad-web --include-workspace-root=false --ignore-scripts
      - run: npm test --workspace @famille/grillad-web
      - run: node scripts/grillad/cloudflare-pages-build.mjs
      - run: test -s apps/web/grillad/dist/index.html && test -s apps/web/grillad/dist/_headers && test -s apps/web/grillad/dist/manifest.webmanifest && ! grep -q '__GRILLAD_ASSETS__' apps/web/grillad/dist/sw.js
      - run: npx --workspace @famille/grillad-web playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @famille/grillad-web
      - name: Connected candidate browser contract (mock HTTP only)
        env:
          VITE_GRILLAD_API_URL: https://grillad-fixture.supabase.co/functions/v1/grillad
          VITE_GRILLAD_PUBLIC_KEY: sb_publishable_fixture
        run: |
          node scripts/grillad/cloudflare-pages-build.mjs
          npm exec --workspace @famille/grillad-web -- playwright test --config playwright.connected.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grillad-web-test-results
          path: apps/web/grillad/test-results/
          if-no-files-found: ignore
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon :grillad:testDebugUnitTest :grillad:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grillad-android-test-results
          path: apps/android/grillad/build/test-results/
          if-no-files-found: ignore
  server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grillad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d grillad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: grillad_test
    steps:
      - uses: actions/checkout@v4
      - run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/local-tests/0002_bootstrap_local_auth.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/0001_famille_core_proposed.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/0002_famille_core_rls.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/0003_prompt_0_3_contextual_rls.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_business_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/local-tests/grillad_business_v1_assertions.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_attendance_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/local-tests/grillad_attendance_v1_assertions.sql
          psql -X -v ON_ERROR_STOP=1 -c 'create role service_role nologin bypassrls'
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/0004_prompt_0_4_account_lifecycle.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_auth_bridge_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/local-tests/grillad_auth_bridge_assertions.sql
