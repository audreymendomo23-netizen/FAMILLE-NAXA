name: GRILLAD — construction locale et qualification
on:
  push:
    branches: [work/grillad-foundation-20261127]
    paths:
      - 'apps/android/grillad/**'
      - 'apps/web/grillad/**'
      - 'scripts/grillad/**'
      - 'supabase/functions/grillad/**'
      - 'supabase/functions/grillad-daily/**'
      - 'supabase/drafts/grillad*.sql'
      - 'supabase/local-tests/grillad*.sql'
      - '.github/workflows/grillad-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/grillad/infrastructure.test.mjs scripts/grillad/central-identity.test.mjs scripts/grillad/naxa-runner-reuse.test.mjs supabase/functions/grillad/handler.test.mjs
  web:
    strategy:
      fail-fast: false
      matrix:
        suite: [unit-build, demo, connected, business-connected]
    name: web (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --workspace @famille/grillad-web --include-workspace-root=false --ignore-scripts
      - if: matrix.suite == 'unit-build'
        run: npm test --workspace @famille/grillad-web
      - if: matrix.suite == 'unit-build' || matrix.suite == 'demo'
        run: node scripts/grillad/cloudflare-pages-build.mjs
      - if: matrix.suite == 'unit-build'
        run: test -s apps/web/grillad/dist/index.html && test -s apps/web/grillad/dist/_headers && test -s apps/web/grillad/dist/manifest.webmanifest && ! grep -q '__GRILLAD_ASSETS__' apps/web/grillad/dist/sw.js
      - if: matrix.suite != 'unit-build'
        run: npx --workspace @famille/grillad-web playwright install --with-deps chromium
      - if: matrix.suite == 'demo'
        run: npm run test:e2e --workspace @famille/grillad-web
      - name: Connected candidate browser contract (mock HTTP only)
        if: matrix.suite == 'connected' || matrix.suite == 'business-connected'
        env:
          VITE_GRILLAD_API_URL: https://grillad-fixture.supabase.co/functions/v1/grillad
          VITE_GRILLAD_PUBLIC_KEY: sb_publishable_fixture
        run: |
          node scripts/grillad/cloudflare-pages-build.mjs
          if [ '${{ matrix.suite }}' = connected ]; then
            npm exec --workspace @famille/grillad-web -- playwright test --config playwright.connected.config.ts connected.spec.ts
          else
            npm exec --workspace @famille/grillad-web -- playwright test --config playwright.connected.config.ts business.spec.ts
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grillad-web-test-results-${{ matrix.suite }}
          path: apps/web/grillad/test-results/
          if-no-files-found: ignore
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Android build and tests (retry transient plugin resolution only)
        env:
          GRILLAD_FIREBASE_PROJECT: ${{ vars.GRILLAD_FIREBASE_PROJECT || secrets.GRILLAD_FIREBASE_PROJECT }}
          GRILLAD_FIREBASE_SENDER: ${{ vars.GRILLAD_FIREBASE_SENDER || secrets.GRILLAD_FIREBASE_SENDER }}
          GRILLAD_FIREBASE_APP_ID: ${{ vars.GRILLAD_FIREBASE_APP_ID || secrets.GRILLAD_FIREBASE_APP_ID }}
          GRILLAD_FIREBASE_API_KEY: ${{ vars.GRILLAD_FIREBASE_API_KEY || secrets.GRILLAD_FIREBASE_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          if gradle --no-daemon --stacktrace :grillad:testDebugUnitTest :grillad:assembleDebug 2>&1 | tee /tmp/grillad-gradle.log; then
            exit 0
          fi
          if grep -Eq "Plugin .* was not found|could not resolve plugin artifact" /tmp/grillad-gradle.log; then
            gradle --no-daemon --stacktrace :grillad:testDebugUnitTest :grillad:assembleDebug
          else
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grillad-android-test-results
          path: apps/android/grillad/build/test-results/
          if-no-files-found: ignore
  server:
    strategy:
      fail-fast: false
      matrix:
        suite: [business, attendance, lifecycle, backup, product-race]
    name: server (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grillad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d grillad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: grillad_test
    steps:
      - uses: actions/checkout@v4
      - run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/local-tests/0002_bootstrap_local_auth.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/0001_famille_core_proposed.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/0002_famille_core_rls.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/0003_prompt_0_3_contextual_rls.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_business_v1.sql
          if [ '${{ matrix.suite }}' = business ]; then
            psql -X -v ON_ERROR_STOP=1 -f supabase/local-tests/grillad_business_v1_assertions.sql
            exit 0
          fi
          if [ '${{ matrix.suite }}' = product-race ]; then
            bash scripts/grillad/product-race.sh
            exit 0
          fi
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_attendance_v1.sql
          if [ '${{ matrix.suite }}' = attendance ]; then
            psql -X -v ON_ERROR_STOP=1 -f supabase/local-tests/grillad_attendance_v1_assertions.sql
            exit 0
          fi
          psql -X -v ON_ERROR_STOP=1 -c 'create role service_role nologin bypassrls'
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/0004_prompt_0_4_account_lifecycle.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_auth_bridge_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_daily_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_connect_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_pilotage_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_security_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_push_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_prediction_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_profile_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_operations_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_lifecycle_followup_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_lifecycle_guards_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_manual_tenders_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_subscription_proofs_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_connect_tenders_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_subscription_claims_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_identity_review_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_capture_devices_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_connect_pairs_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/drafts/grillad_capture_match_v1.sql
          if [ '${{ matrix.suite }}' = backup ]; then
            bash scripts/grillad/backup-restore-drill.sh
          else
            psql -X -v ON_ERROR_STOP=1 -f supabase/local-tests/grillad_auth_bridge_assertions.sql
            psql -X -v ON_ERROR_STOP=1 -f supabase/local-tests/grillad_operations_assertions.sql
          fi
  api-contracts:
    name: lot-01 (50 API contracts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test --test-reporter=spec scripts/grillad/recettes/lot-01.test.mjs

  api-supplement:
    strategy:
      fail-fast: false
      matrix:
        lot: ['02','03','04']
    name: lot-${{ matrix.lot }} (API supplement)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test --test-reporter=spec scripts/grillad/recettes/lot-${{ matrix.lot }}.test.mjs
