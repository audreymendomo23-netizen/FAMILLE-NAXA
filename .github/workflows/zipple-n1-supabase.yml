name: ZIPPLE N1 — Supabase adapter candidate
on:
  push:
    branches: [main]
    paths:
      - "docs/apps/zipple/n1/backend/**"
      - ".github/workflows/zipple-n1-supabase.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adapter-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: zipple
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zipple"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:local_test_only@127.0.0.1:5432/zipple
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Draft schema on ephemeral PostgreSQL
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -X -U postgres -d zipple -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create table auth.users(id uuid primary key);
          SQL
          docker exec -i "${{ job.services.postgres.id }}" psql -X -U postgres -d zipple -v ON_ERROR_STOP=1 < docs/apps/zipple/n1/backend/schema.sql
      - run: npm install --no-save --ignore-scripts pg@8.13.3
      - run: node --test docs/apps/zipple/n1/backend/adapter.test.mjs
