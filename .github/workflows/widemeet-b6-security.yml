name: WideMeet B6 — isolated security qualification
on:
  workflow_call:
  pull_request:
    branches: [test/widemeet-b6-qualification-20261127]
    types: [opened, synchronize, reopened]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  purge-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test packages/media-core/widemeet-b6-*.test.mjs
      - run: node --test packages/widemeet-domain/room-policy.test.mjs
      - run: node --check scripts/widemeet/b6-storage-replay.mjs && node --check scripts/widemeet/b6-postgres-restore.mjs
      - run: node --check packages/media-core/widemeet-recorder.mjs && node --check scripts/widemeet/media-product-replay.mjs
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build --workspace @famille/widemeet-web
      - run: node scripts/widemeet/pdf-replay.mjs
      - name: Validate actual Excel workbook with independent reader
        run: |
          node scripts/widemeet/xlsx-replay.mjs "$RUNNER_TEMP/wm-report.xlsx"
          python -m pip install --quiet openpyxl==3.1.5
          python -c 'import os,openpyxl; w=openpyxl.load_workbook(os.environ["RUNNER_TEMP"]+"/wm-report.xlsx"); assert len(w.sheetnames)==4; assert w["Synthèse"]["B2"].value=="=1+1 & réunion"; assert w["Synthèse"]["B2"].data_type=="s"; assert w["Présences"]["D2"].value==1000; print("WIDEMEET_XLSX_PASS")'
      - run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
          # Hosted Ubuntu runner already supplies Chromium libraries; verify by launching.
          npx playwright install chromium
          node --input-type=module -e 'import {chromium} from "@playwright/test"; const b=await chromium.launch(); await b.close();'
      - run: npx playwright test --config apps/web/widemeet/playwright.config.mjs
      - run: |
          test -s apps/web/widemeet/dist/index.html
          test -s apps/web/widemeet/dist/sw.js
          test -s apps/web/widemeet/dist/manifest.webmanifest
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Native build and unit tests (bounded Maven resolution retry)
        run: |
          set -euo pipefail
          tasks=(:widemeet:testDebugUnitTest :widemeet:assembleDebug :widemeet:assembleDebugAndroidTest)
          if gradle --offline --no-daemon --max-workers=2 "${tasks[@]}" > "$RUNNER_TEMP/wm-gradle-offline.log" 2>&1; then
            echo "WM_GRADLE_OFFLINE=true" >> "$GITHUB_ENV"
            echo "WM_CI_CENTRAL_ALTERNATE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          refresh=()
          for attempt in 1 2 3 4; do
            if [ "$attempt" -eq 2 ] || [ "$attempt" -eq 4 ]; then export WM_CI_CENTRAL_ALTERNATE=true; else export WM_CI_CENTRAL_ALTERNATE=false; fi
            if gradle --no-daemon --max-workers=2 --stacktrace "${refresh[@]}" "${tasks[@]}" 2>&1 | tee "$RUNNER_TEMP/wm-gradle-build.log"; then
              echo "WM_CI_CENTRAL_ALTERNATE=$WM_CI_CENTRAL_ALTERNATE" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            if grep -Eq 'Received status code (429|502|503) from server' "$RUNNER_TEMP/wm-gradle-build.log"; then
              echo "Retrying transient Maven HTTP failure on alternate official endpoint"
            elif grep -Eq 'https://(repo\.maven\.apache\.org|repo1\.maven\.org)/maven2/.*Received status code 403 from server' "$RUNNER_TEMP/wm-gradle-build.log"; then
              echo "Public Maven endpoint returned HTTP 403; retry the same pinned dependencies at the other official endpoint"
            elif grep -Fq "Could not resolve all files for configuration ':widemeet:debugRuntimeClasspath'" "$RUNNER_TEMP/wm-gradle-build.log" && grep -Eq 'Could not find (org\.jetbrains\.kotlin:kotlin-stdlib-jdk8:1\.8\.21|io\.github\.webrtc-sdk:android-prefixed:125\.6422\.06\.1|org\.jetbrains\.kotlinx:kotlinx-serialization-json:1\.5\.0|com\.google\.protobuf:protobuf-javalite:3\.22\.0|com\.google\.dagger:dagger:2\.46|com\.vdurmont:semver4j:3\.1\.0|com\.squareup\.okio:okio:3\.6\.0)\.' "$RUNNER_TEMP/wm-gradle-build.log" && grep -Eq 'https://(repo\.maven\.apache\.org|repo1\.maven\.org)/maven2/' "$RUNNER_TEMP/wm-gradle-build.log"; then
              # Known published fixed versions: refresh cached misses before trying the other official endpoint.
              refresh=(--refresh-dependencies)
              echo "Refreshing known Maven Central dependency metadata after resolution miss"
            elif grep -Fq "ModuleVersionResolveException.getMessage" "$RUNNER_TEMP/wm-gradle-build.log" && grep -Fq 'Cannot invoke "java.util.List.get(int)" because "path" is null' "$RUNNER_TEMP/wm-gradle-build.log"; then
              # Retry the exact same tasks when Gradle masks the Maven resolver error.
              # Persistent failure remains fatal; no tests or compilation are skipped.
              refresh=(--refresh-dependencies)
              echo "Retrying bounded Gradle resolver diagnostic failure with fresh metadata"
            else
              exit 1
            fi
            sleep $((attempt * 20))
          done
      - run: test -s apps/android/widemeet/build/outputs/apk/debug/widemeet-debug.apk
      - name: Enable KVM for family emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Compose and Keystore recipes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-linux-hw-accel: false
          disable-animations: true
          script: if [ "${WM_GRADLE_OFFLINE:-false}" = true ]; then gradle --offline --no-daemon --max-workers=2 :widemeet:connectedDebugAndroidTest; else gradle --no-daemon --max-workers=2 :widemeet:connectedDebugAndroidTest; fi
      - uses: actions/upload-artifact@v4
        with:
          name: widemeet-debug-apk
          path: apps/android/widemeet/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  identity-sql:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture_password
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture_password
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;
          create role service_role bypassrls;
          create schema auth;
          create table auth.users(id uuid primary key);
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n1_identity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/widemeet_identity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n2_n3_rooms.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/widemeet_rooms.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n1_billing.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/widemeet_billing.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n2_external.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n3_recording.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/widemeet_recording.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n3_recording_archive.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n4_minutes.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/widemeet_minutes.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n4_tasks.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/widemeet_tasks.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n2_series.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n4_presence.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n2_expiry.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/widemeet_expiry.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n4_notifications.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n4_reports.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_support.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_workspace_centers.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_transcription.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_b6_audio_purge.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/widemeet_b6_audio_purge.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_b6_minutes_purge.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/widemeet_b6_minutes_purge.sql
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_b6_device_lease.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/widemeet_b6_device_lease.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Seed post-purge data in disposable database and rehearse encrypted restore
        env:
          WM_B6_ISOLATED: 'true'
          WM_B6_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          sed 's/^rollback;$/commit;/' supabase/tests/drafts/widemeet_b6_minutes_purge.sql | psql -v ON_ERROR_STOP=1
          node scripts/widemeet/b6-postgres-restore.mjs

  authenticated-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Start disposable Supabase, never linked
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wm-replay"
          cd "$RUNNER_TEMP/wm-replay"
          supabase init
          supabase start
          supabase status -o env > "$RUNNER_TEMP/wm-replay.env"
          chmod 600 "$RUNNER_TEMP/wm-replay.env"
      - name: Install only WideMeet drafts into disposable PostgreSQL
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/wm-replay.env"; set +a
          [[ "$API_URL" == http://127.0.0.1:54321 ]] || exit 1
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          if ! command -v psql >/dev/null; then
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update -qq
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y postgresql-client
          fi
          psql --version
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n1_identity.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n2_n3_rooms.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n1_billing.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n2_external.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n4_minutes.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n4_tasks.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n2_series.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n4_presence.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n2_expiry.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n4_notifications.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n4_reports.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_support.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_workspace_centers.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "notify pgrst, 'reload schema'"
      - name: Build Web and prepare isolated browser TLS
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install chromium
          node --input-type=module -e 'import {chromium} from "@playwright/test"; const b=await chromium.launch(); await b.close();'
          VITE_WIDEMEET_CHAT_MEDIA_ENABLED=true VITE_WIDEMEET_AUTH_URL=https://127.0.0.1:8443/functions/v1/widemeet-auth VITE_WIDEMEET_SIGNUP_TEST=true VITE_WIDEMEET_RECOVERY_ENABLED=true VITE_WIDEMEET_MINUTES_ENABLED=true VITE_WIDEMEET_SERIES_ENABLED=true VITE_WIDEMEET_PRESENCE_ENABLED=true VITE_WIDEMEET_NOTICES_ENABLED=true VITE_WIDEMEET_REPORTS_ENABLED=true VITE_WIDEMEET_EXTERNAL_ENABLED=true npm run build --workspace @famille/widemeet-web
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' -keyout "$RUNNER_TEMP/wm-replay.key" -out "$RUNNER_TEMP/wm-replay.crt" 2>/dev/null
          chmod 600 "$RUNNER_TEMP/wm-replay.key"
      - name: Execute real two-account Edge and Chromium Replay
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/wm-replay.env"; set +a
          [[ "$API_URL" == http://127.0.0.1:54321 ]] || exit 1
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export WM_WORKSPACE_CENTERS_QUALIFIED=true WM_SUPPORT_QUALIFIED=true WM_AUTH_QUALIFIED=true WM_SERIES_QUALIFIED=true WM_MINUTES_QUALIFIED=true WM_PRESENCE_QUALIFIED=true WM_NOTICES_QUALIFIED=true WM_REPORTS_QUALIFIED=true WM_EXTERNAL_GUESTS_QUALIFIED=true WM_RECOVERY_KEY_QUALIFIED=true WM_BILLING_TEST=true WM_SIGNUP_QUALIFIED=true WM_AUTH_ALIAS_DOMAIN=example.test WM_ROOM_QUALIFIED=true WM_MEDIA_QUALIFIED=false WM_ALLOWED_ORIGINS=https://127.0.0.1:8443
          export WM_REPLAY_KEY="$RUNNER_TEMP/wm-replay.key" WM_REPLAY_CERT="$RUNNER_TEMP/wm-replay.crt"
          node scripts/widemeet/replay.mjs
      - name: Stop disposable stack
        if: always()
        run: |
          cd "$RUNNER_TEMP/wm-replay" && supabase stop --no-backup

  real-media-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated recording dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund livekit-client@2.25.0 livekit-server-sdk@2.20.1 ws@8.18.3 @playwright/test@1.56.1
          npx playwright install chromium
          node --input-type=module -e 'import {chromium} from "@playwright/test"; const b=await chromium.launch({headless:true,args:["--use-fake-device-for-media-stream","--use-fake-ui-for-media-stream"]}); await b.close();'
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update -qq
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y ffmpeg
          fi
          ffmpeg -version
      - name: Start private Redis, SFU and Egress
        run: |
          set -euo pipefail
          KEY=naxareplay
          SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$SECRET"
          echo "LK_TEST_KEY=$KEY" >> "$GITHUB_ENV"
          echo "LK_TEST_SECRET=$SECRET" >> "$GITHUB_ENV"
          echo "WM_TEST_EGRESS=true" >> "$GITHUB_ENV"
          OUT="$RUNNER_TEMP/wm-egress-out"
          mkdir -p "$OUT"
          chmod 777 "$OUT"
          echo "WM_EGRESS_OUT=$OUT" >> "$GITHUB_ENV"
          docker run -d --name wm-audio-redis --network host redis:7.4.1-alpine redis-server --bind 127.0.0.1 --port 6381 --save "" --appendonly no
          # Egress Go SDK does not reliably pair loopback-only ICE candidates. Keep
          # signaling and Redis private; advertise the isolated runner interface for RTP.
          RTC_IP="$(ip -4 route get 192.0.2.1 | awk '{for(i=1;i<=NF;i++) if($i=="src"){print $(i+1);exit}}')"
          [[ "$RTC_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ && "$RTC_IP" != 127.* ]] || exit 1
          cat > "$RUNNER_TEMP/wm-audio-lk.yaml" <<EOF
          port: 7880
          bind_addresses: ["127.0.0.1"]
          redis:
            address: 127.0.0.1:6381
          rtc:
            node_ip: $RTC_IP
            use_external_ip: false
            tcp_port: 7882
            udp_port: 7883
          room:
            auto_create: false
            enable_remote_unmute: false
          keys:
            $KEY: $SECRET
          EOF
          cat > "$RUNNER_TEMP/wm-egress.yaml" <<EOF
          api_key: $KEY
          api_secret: $SECRET
          ws_url: ws://127.0.0.1:7880
          insecure: true
          redis:
            address: 127.0.0.1:6381
          health_port: 7990
          logging:
            level: debug
            json: true
          cpu_cost:
            room_composite_cpu_cost: 1
            audio_room_composite_cpu_cost: 1
          EOF
          chmod 600 "$RUNNER_TEMP/wm-audio-lk.yaml"
          chmod 644 "$RUNNER_TEMP/wm-egress.yaml"
          docker run -d --name wm-audio-lk --network host -v "$RUNNER_TEMP/wm-audio-lk.yaml:/etc/livekit.yaml:ro" livekit/livekit-server:v1.13.9 --config /etc/livekit.yaml
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:7880/ >/dev/null; then break; fi; sleep 1; done
          curl -fsS http://127.0.0.1:7880/
          docker run -d --name wm-audio-egress --network host --cap-add SYS_ADMIN -e EGRESS_CONFIG_FILE=/etc/egress.yaml -v "$RUNNER_TEMP/wm-egress.yaml:/etc/egress.yaml:ro" -v "$OUT:/out" livekit/egress:v1.14.1
          for i in $(seq 1 90); do if curl -fsS http://127.0.0.1:7990/ >/dev/null; then exit 0; fi; sleep 1; done
          echo "Egress readiness failed"
          exit 1
      - name: Verify actual audio-only capture (synthetic devices only)
        run: node scripts/widemeet/media-replay.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Isolated product recording database
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wm-recording-db"
          cd "$RUNNER_TEMP/wm-recording-db"
          supabase init
          supabase start
          supabase status -o env > "$RUNNER_TEMP/wm-recording.env"
          chmod 600 "$RUNNER_TEMP/wm-recording.env"
          set -a; source "$RUNNER_TEMP/wm-recording.env"; set +a
          [[ "$API_URL" == http://127.0.0.1:54321 ]] || exit 1
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          if ! command -v psql >/dev/null; then
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update -qq
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y postgresql-client
          fi
          psql --version
          for name in widemeet_n1_identity widemeet_n2_n3_rooms widemeet_n1_billing widemeet_n2_external widemeet_n3_recording widemeet_n3_recording_archive widemeet_n4_minutes widemeet_n4_presence widemeet_transcription; do
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/drafts/$name.sql"
          done
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "notify pgrst, 'reload schema'"
      - name: Exercise actual consent-driven WideMeet Egress with private quarantine
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/wm-recording.env"; set +a
          [[ "$API_URL" == http://127.0.0.1:54321 ]] || exit 1
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export WM_AUTH_QUALIFIED=true WM_ROOM_QUALIFIED=true WM_PRESENCE_QUALIFIED=true WM_EXTERNAL_GUESTS_QUALIFIED=true WM_MEDIA_QUALIFIED=true WM_RECORDING_QUALIFIED=true WM_RECORDING_STORAGE_QUALIFIED=true WM_TRANSCRIPTION_QUALIFIED=false WM_ALLOWED_ORIGINS=http://127.0.0.1:4173
          export WM_LIVEKIT_URL=wss://127.0.0.1:7881 WM_LIVEKIT_API_KEY="$LK_TEST_KEY" WM_LIVEKIT_API_SECRET="$LK_TEST_SECRET"
          node scripts/widemeet/media-product-replay.mjs
      - name: Stop isolated recording database
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/wm-recording-db"; then cd "$RUNNER_TEMP/wm-recording-db" && supabase stop --no-backup; fi
      - name: Diagnostic status on failure (synthetic room only)
        if: failure()
        run: |
          for c in wm-audio-egress wm-audio-lk; do
            docker logs --tail 150 "$c" 2>&1 | sed -E 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[REDACTED_JWT]/g' || true
          done
      - name: Cleanup private test recording and containers
        if: always()
        run: |
          docker rm -f wm-audio-egress wm-audio-lk wm-audio-redis || true
          rm -rf "$RUNNER_TEMP/wm-egress-out" "$RUNNER_TEMP/wm-audio-lk.yaml" "$RUNNER_TEMP/wm-egress.yaml"

  real-storage-purge-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Start disposable Supabase, never linked
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wm-replay"
          cd "$RUNNER_TEMP/wm-replay"
          supabase init
          supabase start
          supabase status -o env > "$RUNNER_TEMP/wm-replay.env"
          chmod 600 "$RUNNER_TEMP/wm-replay.env"
      - name: Install only WideMeet drafts into disposable PostgreSQL
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/wm-replay.env"; set +a
          [[ "$API_URL" == http://127.0.0.1:54321 ]] || exit 1
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          if ! command -v psql >/dev/null; then
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update -qq
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y postgresql-client
          fi
          psql --version
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n1_identity.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n2_n3_rooms.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n1_billing.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n2_external.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n4_minutes.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n4_tasks.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n2_series.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n4_presence.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n2_expiry.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n4_notifications.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n4_reports.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_support.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_workspace_centers.sql
          for name in widemeet_n3_recording widemeet_n3_recording_archive widemeet_transcription widemeet_b6_audio_purge widemeet_b6_minutes_purge; do
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "supabase/drafts/$name.sql"
          done
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "notify pgrst, 'reload schema'"
      - name: Verify actual private storage purge and encrypted restoration
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/wm-replay.env"; set +a
          [[ "$API_URL" == http://127.0.0.1:54321 ]] || exit 1
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" WM_B6_ISOLATED=true
          node scripts/widemeet/b6-storage-replay.mjs
      - name: Stop disposable stack
        if: always()
        run: |
          cd "$RUNNER_TEMP/wm-replay" && supabase stop --no-backup
