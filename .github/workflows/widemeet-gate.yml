name: WideMeet — N0/N1 isolated gate
on:
  push:
    branches: [work/widemeet-n0-20261126]
    paths:
      - 'apps/android/widemeet/**'
      - 'apps/web/widemeet/**'
      - 'packages/widemeet-domain/**'
      - 'packages/billing-core/**'
      - 'settings.gradle.kts'
      - '.github/workflows/widemeet-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: widemeet-gate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test apps/web/widemeet/src/domain.test.mjs apps/web/widemeet/src/session.test.mjs packages/widemeet-domain/*.test.mjs
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build --workspace @famille/widemeet-web
      - run: |
          test -s apps/web/widemeet/dist/index.html
          test -s apps/web/widemeet/dist/sw.js
          test -s apps/web/widemeet/dist/manifest.webmanifest
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle --no-daemon --stacktrace :widemeet:testDebugUnitTest :widemeet:assembleDebug
      - run: test -s apps/android/widemeet/build/outputs/apk/debug/widemeet-debug.apk
