name: WideMeet — N0/N1 isolated gate
on:
  push:
    branches: [work/widemeet-n0-20261126]
    paths:
      - 'apps/android/widemeet/**'
      - 'apps/web/widemeet/**'
      - 'packages/widemeet-domain/**'
      - 'packages/billing-core/**'
      - 'settings.gradle.kts'
      - 'supabase/drafts/widemeet_*.sql'
      - 'supabase/tests/drafts/widemeet_*.sql'
      - 'supabase/functions/widemeet-auth/**'
      - '.github/workflows/widemeet-gate.yml'
  pull_request:
    branches: [test/widemeet-qualification-20261126]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: widemeet-gate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test apps/web/widemeet/src/domain.test.mjs apps/web/widemeet/src/session.test.mjs packages/widemeet-domain/*.test.mjs
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build --workspace @famille/widemeet-web
      - run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - run: npx playwright test --config apps/web/widemeet/playwright.config.mjs
      - run: |
          test -s apps/web/widemeet/dist/index.html
          test -s apps/web/widemeet/dist/sw.js
          test -s apps/web/widemeet/dist/manifest.webmanifest
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle --no-daemon --stacktrace :widemeet:testDebugUnitTest :widemeet:assembleDebug
      - run: test -s apps/android/widemeet/build/outputs/apk/debug/widemeet-debug.apk

  identity-sql:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture_password
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fixture_password
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;
          create role service_role bypassrls;
          create schema auth;
          create table auth.users(id uuid primary key);
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase/drafts/widemeet_n1_identity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/drafts/widemeet_identity.sql
  edge-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/widemeet-auth/index.ts
