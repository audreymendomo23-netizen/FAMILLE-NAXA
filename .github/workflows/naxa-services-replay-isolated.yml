          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_meeting_briefing.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.ns_internal_meetings') is null and to_regprocedure('public.ns_daily_briefing(uuid,uuid,date)') is null" | grep -Fx t
      - name: Qualify meeting invitation lifecycle and revocation with rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_meeting_lifecycle.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.ns_internal_meeting_history') is null" | grep -Fx t
      - name: Qualify scoped media grant with rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_meeting_media_grant.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regprocedure('public.ns_meeting_media_grant(uuid)') is null" | grep -Fx t
      - name: Qualify collaboration and moderation with rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_meeting_collaboration.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.ns_meeting_chat') is null and to_regclass('public.ns_meeting_moderation') is null" | grep -Fx t
      - name: Qualify recording request lifecycle with rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_recording_request.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.ns_meeting_recording_requests') is null" | grep -Fx t
      - name: Qualify meeting creation details with rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_meeting_creation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regprocedure('public.ns_schedule_internal_meeting_details(uuid,uuid,uuid,uuid,text,timestamptz,uuid[],text,integer)') is null" | grep -Fx t
      - name: Qualify recurring meetings with rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_meeting_series.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.ns_meeting_series') is null" | grep -Fx t
      - name: Qualify strict sector fields on disposable DB
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          { sed '$d' supabase/drafts/naxa_services_v20_activity_field_parity.sql; cat supabase/tests/drafts/naxa_services_activity_field_matrix.sql; echo 'rollback;'; } | psql "$DB_URL" -v ON_ERROR_STOP=1
      - name: Qualify mandatory shift GPS with v15 staging fixtures and rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          { sed '/^rollback;$/,$d' supabase/tests/drafts/naxa_services_attendance_staging.sql; sed '1d;$d' supabase/drafts/naxa_services_v21_attendance_mandatory_gps.sql; cat supabase/tests/drafts/naxa_services_attendance_mandatory_gps.sql; echo 'rollback;'; } | psql "$DB_URL" -v ON_ERROR_STOP=1
      - name: Activate attendance candidates on disposable DB for actual browser proof
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          for file in naxa_services_v9_attendance_evidence.sql naxa_services_v9_attendance_sync.sql naxa_services_v15_attendance_staging.sql naxa_services_v16_attendance_review.sql naxa_services_v10_hierarchical_roster.sql naxa_services_v10_roster_service_comparison.sql naxa_services_v10_roster_targets.sql naxa_services_v11_meeting_briefing.sql naxa_services_v12_meeting_lifecycle.sql naxa_services_v12_media_grant.sql naxa_services_v13_meeting_collaboration.sql naxa_services_v14_recording_request.sql naxa_services_v18_meeting_creation.sql naxa_services_v19_meeting_series.sql naxa_services_v20_activity_field_parity.sql naxa_services_v21_attendance_mandatory_gps.sql naxa_services_v22_first_password_gate.sql naxa_services_v23_erp_financial_consistency.sql; do
            test "$(tail -n 1 "supabase/drafts/$file")" = "rollback;" || exit 1
            sed -E '$s/rollback;/commit/' "supabase/drafts/$file" | psql "$DB_URL" -v ON_ERROR_STOP=1 >/dev/null
          done
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "notify pgrst, 'reload schema'"
      - name: Build commercial Web and install Chromium for real Replay
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$API_URL" == http://127.0.0.1:54321 ]] || exit 1
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
          # GitHub-hosted Ubuntu includes Chromium system libraries; avoid unrelated apt repository failures.
          npx playwright install chromium
          node --input-type=module -e 'import { chromium } from "@playwright/test"; const browser=await chromium.launch({headless:true}); await browser.close();'
          VITE_NAXA_SERVICES_BILLING_V23_ENABLED=true VITE_NAXA_SERVICES_ATTENDANCE_ENABLED=true VITE_NAXA_SERVICES_ROSTER_ENABLED=true VITE_NAXA_SERVICES_MEETINGS_ENABLED=true VITE_NAXA_SERVICES_BRIEFING_ENABLED=true VITE_NAXA_SERVICES_AUTH_URL=https://127.0.0.1:8443/functions/v1/naxa-services-auth VITE_SUPABASE_ANON_KEY="$ANON_KEY" npm run build --workspace @famille/naxa-services-web
          # Distinct CA and leaf avoid using a CA certificate as the TLS end entity.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=NAXA Replay disposable CA' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' -keyout "$RUNNER_TEMP/ns-replay-ca.key" -out "$RUNNER_TEMP/ns-replay-ca.crt" 2>/dev/null
          openssl req -new -newkey rsa:2048 -nodes -subj '/CN=127.0.0.1' -keyout "$RUNNER_TEMP/ns-replay.key" -out "$RUNNER_TEMP/ns-replay.csr" 2>/dev/null
          printf '%s\n' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' 'subjectAltName=IP:127.0.0.1' > "$RUNNER_TEMP/ns-replay.ext"
          openssl x509 -req -in "$RUNNER_TEMP/ns-replay.csr" -CA "$RUNNER_TEMP/ns-replay-ca.crt" -CAkey "$RUNNER_TEMP/ns-replay-ca.key" -CAcreateserial -days 1 -extfile "$RUNNER_TEMP/ns-replay.ext" -out "$RUNNER_TEMP/ns-replay.crt" 2>/dev/null
          openssl verify -CAfile "$RUNNER_TEMP/ns-replay-ca.crt" "$RUNNER_TEMP/ns-replay.crt"
          rm -f "$RUNNER_TEMP/ns-replay-ca.key"
          chmod 600 "$RUNNER_TEMP/ns-replay.key"
          # Only change the listening port in an isolated copy; do not change any gateway logic.
          cp -r supabase/functions/naxa-services-accounting "$RUNNER_TEMP/ns-accounting"
          test "$(grep -Fc 'Deno.serve(async (request) => {' "$RUNNER_TEMP/ns-accounting/index.ts")" = 1
          sed -i 's/Deno.serve(async (request) => {/Deno.serve({port:8001},async (request) => {/' "$RUNNER_TEMP/ns-accounting/index.ts"
      - name: Exercise real Auth Admin, gateway, JWT, private Storage, billing and push registration
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$API_URL" == http://127.0.0.1:54321 ]] || exit 1
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export NS_ALLOWED_ORIGINS=http://127.0.0.1:4173,https://127.0.0.1:8443 NS_AUTH_ALIAS_DOMAIN=example.test
          export NS_PUSH_TOKEN_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          export NS_NOTIFICATION_WORKER_SECRET="$(openssl rand -hex 32)"
          unset FCM_SERVICE_ACCOUNT_JSON NS_FIREBASE_PROJECT_ID
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {randomUUID,randomBytes} from 'node:crypto';
          import {spawn,execFileSync} from 'node:child_process';
          import {chromium} from '@playwright/test';
          import https from 'node:https';
          import http from 'node:http';
          import {readFile,stat,mkdtemp,rm} from 'node:fs/promises';
          import {resolve,extname,sep} from 'node:path';
          const base=process.env.SUPABASE_URL, anon=process.env.SUPABASE_ANON_KEY, admin=process.env.SUPABASE_SERVICE_ROLE_KEY;
          assert.equal(base,'http://127.0.0.1:54321');
          const gateway='http://127.0.0.1:8000';
          let child;
          const pause=ms=>new Promise(r=>setTimeout(r,ms));
          async function stop(){if(child){const c=child;child=undefined;c.kill('SIGTERM');if(c.exitCode===null)await new Promise(r=>c.once('exit',r));}}
          async function start(name){
            await stop();
            child=spawn('deno',['run','--allow-env','--allow-net=127.0.0.1:54321,0.0.0.0:8000,127.0.0.1:8000','supabase/functions/naxa-services-'+name+'/index.ts'],{stdio:['ignore','ignore','ignore']});
            for(let i=0;i<40;i++){try{const r=await fetch(gateway,{method:'OPTIONS'});if(r.ok)return;}catch{}if(child.exitCode!==null)break;await pause(250);}
            throw Error('GATEWAY_START_FAILED_'+name);
          }
          const headers=(token=admin,key=admin)=>({apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json'});
          async function json(url,body,token=admin,key=admin,method='POST'){
            const r=await fetch(url,{method,headers:{...headers(token,key),Prefer:'return=representation'},...(body===undefined?{}:{body:JSON.stringify(body)})});
            const data=await r.json().catch(()=>null);
            return {status:r.status,data};
          }
          async function success(url,body,token=admin,key=admin,method='POST'){
            const r=await json(url,body,token,key,method);assert.ok(r.status>=200&&r.status<300,'HTTP '+r.status+' at '+new URL(url).pathname);return r.data;
          }
          const rest=(table,body)=>success(base+'/rest/v1/'+table,body);
          const pass=label=>console.log('PASS '+label);
          async function fixture(suffix,mode='solo'){
            const email='ns-replay-'+suffix+'-'+randomUUID()+'@example.test', password='Qa7!'+randomBytes(18).toString('hex');
            const user=await success(base+'/auth/v1/admin/users',{email,password,email_confirm:true,app_metadata:{app_code:'naxa-services'}});
            assert.match(user.id,/^[0-9a-f-]{36}$/);
            const [org]=await rest('ns_organizations',{display_name:'Replay '+suffix,business_mode:mode});
            const login='NS-'+randomBytes(5).toString('hex').toUpperCase();
            const [account]=await rest('ns_accounts',{auth_user_id:user.id,login_id:login,auth_alias:email,password_change_required:false});
            const [member]=await rest('ns_members',{org_id:org.id,account_id:account.id,display_name:'Recette '+suffix,role_code:'promoter'});
            const [site]=await rest('ns_sites',{org_id:org.id,code:'REPLAY',name:'Recette isolée'});
            await rest('ns_member_scopes',{org_id:org.id,member_id:member.id,scope_type:'organization',scope_id:org.id,can_read:true,can_operate:true,can_manage:true});
            return {user,org,member,site,login,password,device:{installation_id:randomUUID(),platform:'web',label:'Replay'}};
          }
          const act=(action,body={},token=anon)=>json(gateway,{app_code:'naxa-services',action,...body},token,anon);
