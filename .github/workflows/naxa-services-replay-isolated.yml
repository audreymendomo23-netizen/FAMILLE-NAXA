name: NAXA SERVICES — Replay isolé Auth, Storage et abonnements
on:
  workflow_dispatch:
  push:
    branches: [work/naxa-services-completion-20261120]
    paths:
      - '.github/workflows/naxa-services-replay-isolated.yml'
      - 'supabase/drafts/naxa_services_v9_attendance*.sql'
      - 'supabase/drafts/naxa_services_v15_attendance*.sql'
      - 'supabase/drafts/naxa_services_v16_attendance*.sql'
      - 'supabase/drafts/naxa_services_v17_attendance*.sql'
      - 'supabase/tests/drafts/naxa_services_attendance*.sql'
      - 'supabase/drafts/naxa_services_v10_*roster*.sql'
      - 'supabase/tests/drafts/naxa_services_*roster*.sql'
      - 'supabase/drafts/naxa_services_v11_meeting_briefing.sql'
      - 'supabase/tests/drafts/naxa_services_meeting_briefing.sql'
      - 'supabase/drafts/naxa_services_v12_meeting_lifecycle.sql'
      - 'supabase/tests/drafts/naxa_services_meeting_lifecycle.sql'
      - 'supabase/drafts/naxa_services_v12_media_grant.sql'
      - 'supabase/tests/drafts/naxa_services_meeting_media_grant.sql'
      - 'supabase/drafts/naxa_services_v13_meeting_collaboration.sql'
      - 'supabase/tests/drafts/naxa_services_meeting_collaboration.sql'
      - 'supabase/drafts/naxa_services_v14_recording_request.sql'
      - 'supabase/drafts/naxa_services_v18_meeting_creation.sql'
      - 'supabase/drafts/naxa_services_v19_meeting_series.sql'
      - 'supabase/drafts/naxa_services_v20_activity_field_parity.sql'
      - 'supabase/tests/drafts/naxa_services_activity_field_matrix.sql'
      - 'apps/web/naxa-services/src/**'
      - 'supabase/tests/drafts/naxa_services_meeting_series.sql'
      - 'supabase/tests/drafts/naxa_services_meeting_creation.sql'
      - 'supabase/tests/drafts/naxa_services_recording_request.sql'
permissions:
  contents: read
concurrency:
  group: naxa-services-real-local-replay
  cancel-in-progress: false
jobs:
  actual-local-auth-storage:
    name: Real GoTrue sessions, Storage and tenant isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Start disposable Supabase (no linked project or hosted secrets)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ns-replay"
          cd "$RUNNER_TEMP/ns-replay"
          supabase --version
          supabase init --help >/dev/null
          supabase start --help >/dev/null
          supabase status --help >/dev/null
          supabase init
          supabase start
          supabase status -o env > "$RUNNER_TEMP/ns-replay.env"
          chmod 600 "$RUNNER_TEMP/ns-replay.env"
      - name: Install exact NAXA SERVICES schema only on local DB
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$API_URL" == http://127.0.0.1:54321 ]] || { echo 'Unexpected API host'; exit 1; }
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || { echo 'Unexpected DB host'; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "create extension if not exists pgcrypto with schema extensions"
          for file in naxa_services_v1.sql naxa_services_v2_activity_onboarding_management.sql naxa_services_v3_operations_rewards_sync.sql naxa_services_v4_supplier_accounting_forecast.sql naxa_services_referrals_v1.sql naxa_services_v5_customer_referrals_promotions.sql naxa_services_v6_notifications.sql naxa_services_v7_financial_controls.sql naxa_services_v8_subscription_payment.sql; do
            test "$(tail -n 1 "supabase/drafts/$file")" = "rollback;" || exit 1
            sed -E '$s/rollback;/commit/' "supabase/drafts/$file" | psql "$DB_URL" -v ON_ERROR_STOP=1 >/dev/null
            echo "Applied local draft: $file"
          done
          for file in 20261126080317_naxa_services_strict_site_management_scope.sql 20261126133458_naxa_services_push_only_notification_claim.sql 20261126133841_naxa_services_bound_push_tokens.sql 20261126140054_naxa_services_notification_device_deliveries.sql 20261126140440_naxa_services_private_profile_photo_access.sql; do
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "docs/naxa-services/hosted-migrations/$file" >/dev/null
            echo "Applied local archive: $file"
          done
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into storage.buckets(id,name,public,file_size_limit,allowed_mime_types)
          values('ns-profile-photos','ns-profile-photos',false,2097152,array['image/jpeg','image/png','image/webp']);
          notify pgrst, 'reload schema';
          SQL
      - name: Qualify attendance proof candidate with rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_attendance_sync.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.ns_attendance_policies') is null and to_regclass('public.ns_attendance_evidence') is null and not exists (select 1 from storage.buckets where id='ns-attendance-selfies')" | grep -Fx t
      - name: Qualify private attendance staging with rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_attendance_staging.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.ns_attendance_staged_proof') is null and to_regclass('public.ns_attendance_policy_history') is null" | grep -Fx t
      - name: Qualify scoped proof review and expired staging with rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_attendance_review.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regprocedure('public.ns_attendance_review(uuid,uuid,timestamptz,integer)') is null" | grep -Fx t
      - name: Qualify orphan selfie inventory with rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_attendance_orphans.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regprocedure('public.ns_attendance_orphan_candidates(integer)') is null" | grep -Fx t
      - name: Qualify hierarchical roster and service comparison with rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_roster_service_comparison.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.ns_roster_shifts') is null and to_regclass('public.ns_roster_clock_links') is null" | grep -Fx t
      - name: Qualify meetings and scoped briefing with rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_meeting_briefing.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.ns_internal_meetings') is null and to_regprocedure('public.ns_daily_briefing(uuid,uuid,date)') is null" | grep -Fx t
      - name: Qualify meeting invitation lifecycle and revocation with rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_meeting_lifecycle.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.ns_internal_meeting_history') is null" | grep -Fx t
      - name: Qualify scoped media grant with rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_meeting_media_grant.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regprocedure('public.ns_meeting_media_grant(uuid)') is null" | grep -Fx t
      - name: Qualify collaboration and moderation with rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_meeting_collaboration.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.ns_meeting_chat') is null and to_regclass('public.ns_meeting_moderation') is null" | grep -Fx t
      - name: Qualify recording request lifecycle with rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_recording_request.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.ns_meeting_recording_requests') is null" | grep -Fx t
      - name: Qualify meeting creation details with rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_meeting_creation.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regprocedure('public.ns_schedule_internal_meeting_details(uuid,uuid,uuid,uuid,text,timestamptz,uuid[],text,integer)') is null" | grep -Fx t
      - name: Qualify recurring meetings with rollback
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/drafts/naxa_services_meeting_series.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.ns_meeting_series') is null" | grep -Fx t
      - name: Qualify strict sector fields on disposable DB
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          { sed '$d' supabase/drafts/naxa_services_v20_activity_field_parity.sql; cat supabase/tests/drafts/naxa_services_activity_field_matrix.sql; echo 'rollback;'; } | psql "$DB_URL" -v ON_ERROR_STOP=1
      - name: Activate attendance candidates on disposable DB for actual browser proof
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || exit 1
          for file in naxa_services_v9_attendance_evidence.sql naxa_services_v9_attendance_sync.sql naxa_services_v15_attendance_staging.sql naxa_services_v16_attendance_review.sql naxa_services_v10_hierarchical_roster.sql naxa_services_v10_roster_service_comparison.sql naxa_services_v10_roster_targets.sql naxa_services_v11_meeting_briefing.sql naxa_services_v12_meeting_lifecycle.sql naxa_services_v12_media_grant.sql naxa_services_v13_meeting_collaboration.sql naxa_services_v14_recording_request.sql naxa_services_v18_meeting_creation.sql naxa_services_v19_meeting_series.sql naxa_services_v20_activity_field_parity.sql; do
            test "$(tail -n 1 "supabase/drafts/$file")" = "rollback;" || exit 1
            sed -E '$s/rollback;/commit/' "supabase/drafts/$file" | psql "$DB_URL" -v ON_ERROR_STOP=1 >/dev/null
          done
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "notify pgrst, 'reload schema'"
      - name: Build commercial Web and install Chromium for real Replay
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$API_URL" == http://127.0.0.1:54321 ]] || exit 1
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
          VITE_NAXA_SERVICES_ATTENDANCE_ENABLED=true VITE_NAXA_SERVICES_ROSTER_ENABLED=true VITE_NAXA_SERVICES_MEETINGS_ENABLED=true VITE_NAXA_SERVICES_BRIEFING_ENABLED=true VITE_NAXA_SERVICES_AUTH_URL=https://127.0.0.1:8443/functions/v1/naxa-services-auth VITE_SUPABASE_ANON_KEY="$ANON_KEY" npm run build --workspace @famille/naxa-services-web
          # Distinct CA and leaf avoid using a CA certificate as the TLS end entity.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=NAXA Replay disposable CA' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' -keyout "$RUNNER_TEMP/ns-replay-ca.key" -out "$RUNNER_TEMP/ns-replay-ca.crt" 2>/dev/null
          openssl req -new -newkey rsa:2048 -nodes -subj '/CN=127.0.0.1' -keyout "$RUNNER_TEMP/ns-replay.key" -out "$RUNNER_TEMP/ns-replay.csr" 2>/dev/null
          printf '%s\n' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' 'subjectAltName=IP:127.0.0.1' > "$RUNNER_TEMP/ns-replay.ext"
          openssl x509 -req -in "$RUNNER_TEMP/ns-replay.csr" -CA "$RUNNER_TEMP/ns-replay-ca.crt" -CAkey "$RUNNER_TEMP/ns-replay-ca.key" -CAcreateserial -days 1 -extfile "$RUNNER_TEMP/ns-replay.ext" -out "$RUNNER_TEMP/ns-replay.crt" 2>/dev/null
          openssl verify -CAfile "$RUNNER_TEMP/ns-replay-ca.crt" "$RUNNER_TEMP/ns-replay.crt"
          rm -f "$RUNNER_TEMP/ns-replay-ca.key"
          chmod 600 "$RUNNER_TEMP/ns-replay.key"
          # Only change the listening port in an isolated copy; do not change any gateway logic.
          cp -r supabase/functions/naxa-services-accounting "$RUNNER_TEMP/ns-accounting"
          test "$(grep -Fc 'Deno.serve(async (request) => {' "$RUNNER_TEMP/ns-accounting/index.ts")" = 1
          sed -i 's/Deno.serve(async (request) => {/Deno.serve({port:8001},async (request) => {/' "$RUNNER_TEMP/ns-accounting/index.ts"
      - name: Exercise real Auth Admin, gateway, JWT, private Storage, billing and push registration
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$API_URL" == http://127.0.0.1:54321 ]] || exit 1
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export NS_ALLOWED_ORIGINS=http://127.0.0.1:4173,https://127.0.0.1:8443 NS_AUTH_ALIAS_DOMAIN=example.test
          export NS_PUSH_TOKEN_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          export NS_NOTIFICATION_WORKER_SECRET="$(openssl rand -hex 32)"
          unset FCM_SERVICE_ACCOUNT_JSON NS_FIREBASE_PROJECT_ID
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {randomUUID,randomBytes} from 'node:crypto';
          import {spawn} from 'node:child_process';
          import {chromium} from '@playwright/test';
          import https from 'node:https';
          import http from 'node:http';
          import {readFile,stat} from 'node:fs/promises';
          import {resolve,extname,sep} from 'node:path';
          const base=process.env.SUPABASE_URL, anon=process.env.SUPABASE_ANON_KEY, admin=process.env.SUPABASE_SERVICE_ROLE_KEY;
          assert.equal(base,'http://127.0.0.1:54321');
          const gateway='http://127.0.0.1:8000';
          let child;
          const pause=ms=>new Promise(r=>setTimeout(r,ms));
          async function stop(){if(child){const c=child;child=undefined;c.kill('SIGTERM');if(c.exitCode===null)await new Promise(r=>c.once('exit',r));}}
          async function start(name){
            await stop();
            child=spawn('deno',['run','--allow-env','--allow-net=127.0.0.1:54321,0.0.0.0:8000,127.0.0.1:8000','supabase/functions/naxa-services-'+name+'/index.ts'],{stdio:['ignore','ignore','ignore']});
            for(let i=0;i<40;i++){try{const r=await fetch(gateway,{method:'OPTIONS'});if(r.ok)return;}catch{}if(child.exitCode!==null)break;await pause(250);}
            throw Error('GATEWAY_START_FAILED_'+name);
          }
          const headers=(token=admin,key=admin)=>({apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json'});
          async function json(url,body,token=admin,key=admin,method='POST'){
            const r=await fetch(url,{method,headers:{...headers(token,key),Prefer:'return=representation'},...(body===undefined?{}:{body:JSON.stringify(body)})});
            const data=await r.json().catch(()=>null);
            return {status:r.status,data};
          }
          async function success(url,body,token=admin,key=admin,method='POST'){
            const r=await json(url,body,token,key,method);assert.ok(r.status>=200&&r.status<300,'HTTP '+r.status+' at '+new URL(url).pathname);return r.data;
          }
          const rest=(table,body)=>success(base+'/rest/v1/'+table,body);
          const pass=label=>console.log('PASS '+label);
          async function fixture(suffix,mode='solo'){
            const email='ns-replay-'+suffix+'-'+randomUUID()+'@example.test', password='Qa7!'+randomBytes(18).toString('hex');
            const user=await success(base+'/auth/v1/admin/users',{email,password,email_confirm:true,app_metadata:{app_code:'naxa-services'}});
            assert.match(user.id,/^[0-9a-f-]{36}$/);
            const [org]=await rest('ns_organizations',{display_name:'Replay '+suffix,business_mode:mode});
            const login='NS-'+randomBytes(5).toString('hex').toUpperCase();
            const [account]=await rest('ns_accounts',{auth_user_id:user.id,login_id:login,auth_alias:email,password_change_required:false});
            const [member]=await rest('ns_members',{org_id:org.id,account_id:account.id,display_name:'Recette '+suffix,role_code:'promoter'});
            const [site]=await rest('ns_sites',{org_id:org.id,code:'REPLAY',name:'Recette isolée'});
            await rest('ns_member_scopes',{org_id:org.id,member_id:member.id,scope_type:'organization',scope_id:org.id,can_read:true,can_operate:true,can_manage:true});
            return {user,org,member,site,login,password,device:{installation_id:randomUUID(),platform:'web',label:'Replay'}};
          }
          const act=(action,body={},token=anon)=>json(gateway,{app_code:'naxa-services',action,...body},token,anon);
          async function login(f){const r=await act('login',{identifier:f.login,password:f.password,device:f.device});assert.equal(r.status,200,'positive login');assert.equal(r.data.account.organization_id,f.org.id);assert.deepEqual(r.data.account.active_site_ids,[f.site.id]);assert.ok(r.data.access_token&&r.data.refresh_token&&r.data.device_id);return r.data;}
          async function browserReplay(f){
            let browser,server,accounting;
            const root=resolve('apps/web/naxa-services/dist');
            const types={'.html':'text/html','.js':'application/javascript','.css':'text/css','.svg':'image/svg+xml','.png':'image/png','.jpg':'image/jpeg','.webp':'image/webp','.json':'application/json','.webmanifest':'application/manifest+json','.woff2':'font/woff2'};
            try{
              accounting=spawn('deno',['run','--cert',process.env.RUNNER_TEMP+'/ns-replay-ca.crt','--allow-env','--allow-net=127.0.0.1:8443,0.0.0.0:8001,127.0.0.1:8001',process.env.RUNNER_TEMP+'/ns-accounting/index.ts'],{env:{...process.env,SUPABASE_URL:'https://127.0.0.1:8443'},stdio:'ignore'});
              let ready=false;
              for(let i=0;i<40;i++){try{if((await fetch('http://127.0.0.1:8001',{method:'OPTIONS'})).ok){ready=true;break;}}catch{}if(accounting.exitCode!==null)break;await pause(250);}
              assert.ok(ready,'real accounting gateway ready');
              server=https.createServer({key:await readFile(process.env.RUNNER_TEMP+'/ns-replay.key'),cert:await readFile(process.env.RUNNER_TEMP+'/ns-replay.crt')},async(req,res)=>{
                try{
                  const path=new URL(req.url,'https://127.0.0.1:8443').pathname;
                  let upstream;
                  if(path==='/functions/v1/naxa-services-auth')upstream='http://127.0.0.1:8000'+req.url;
                  else if(path==='/functions/v1/naxa-services-accounting')upstream='http://127.0.0.1:8001'+req.url;
                  else if(path.startsWith('/storage/v1/')||path==='/auth/v1/user'||path.startsWith('/rest/v1/'))upstream=base+req.url;
                  if(upstream){const u=new URL(upstream);const forward=http.request(u,{method:req.method,headers:{...req.headers,host:u.host}},r=>{res.writeHead(r.statusCode,r.headers);r.pipe(res);});forward.on('error',()=>{if(!res.headersSent)res.writeHead(502);res.end();});req.pipe(forward);return;}
                  let file=resolve(root,'.'+decodeURIComponent(path));if(file!==root&&!file.startsWith(root+sep)){res.writeHead(403);res.end();return;}
