name: NAXA SERVICES — Replay isolé Auth, Storage et abonnements
on:
  workflow_dispatch:
  push:
    branches: [work/naxa-services-completion-20261120]
    paths:
      - '.github/workflows/naxa-services-replay-isolated.yml'
permissions:
  contents: read
concurrency:
  group: naxa-services-real-local-replay
  cancel-in-progress: false
jobs:
  actual-local-auth-storage:
    name: Real GoTrue sessions, Storage and tenant isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Start disposable Supabase (no linked project or hosted secrets)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ns-replay"
          cd "$RUNNER_TEMP/ns-replay"
          supabase --version
          supabase init --help >/dev/null
          supabase start --help >/dev/null
          supabase status --help >/dev/null
          supabase init
          supabase start
          supabase status -o env > "$RUNNER_TEMP/ns-replay.env"
          chmod 600 "$RUNNER_TEMP/ns-replay.env"
      - name: Install exact NAXA SERVICES schema only on local DB
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$API_URL" == http://127.0.0.1:54321 ]] || { echo 'Unexpected API host'; exit 1; }
          [[ "$DB_URL" == postgresql://postgres:*@127.0.0.1:54322/postgres ]] || { echo 'Unexpected DB host'; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "create extension if not exists pgcrypto with schema extensions"
          for file in naxa_services_v1.sql naxa_services_v2_activity_onboarding_management.sql naxa_services_v3_operations_rewards_sync.sql naxa_services_v4_supplier_accounting_forecast.sql naxa_services_referrals_v1.sql naxa_services_v5_customer_referrals_promotions.sql naxa_services_v6_notifications.sql naxa_services_v7_financial_controls.sql naxa_services_v8_subscription_payment.sql; do
            test "$(tail -n 1 "supabase/drafts/$file")" = "rollback;" || exit 1
            sed -E '$s/rollback;/commit/' "supabase/drafts/$file" | psql "$DB_URL" -v ON_ERROR_STOP=1 >/dev/null
            echo "Applied local draft: $file"
          done
          for file in 20261126080317_naxa_services_strict_site_management_scope.sql 20261126133458_naxa_services_push_only_notification_claim.sql 20261126133841_naxa_services_bound_push_tokens.sql 20261126140054_naxa_services_notification_device_deliveries.sql 20261126140440_naxa_services_private_profile_photo_access.sql; do
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "docs/naxa-services/hosted-migrations/$file" >/dev/null
            echo "Applied local archive: $file"
          done
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          insert into storage.buckets(id,name,public,file_size_limit,allowed_mime_types)
          values('ns-profile-photos','ns-profile-photos',false,2097152,array['image/jpeg','image/png','image/webp']);
          notify pgrst, 'reload schema';
          SQL
      - name: Build commercial Web and install Chromium for real Replay
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$API_URL" == http://127.0.0.1:54321 ]] || exit 1
          npm install --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
          VITE_NAXA_SERVICES_AUTH_URL=https://127.0.0.1:8443/functions/v1/naxa-services-auth VITE_SUPABASE_ANON_KEY="$ANON_KEY" npm run build --workspace @famille/naxa-services-web
          # Distinct CA and leaf avoid using a CA certificate as the TLS end entity.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=NAXA Replay disposable CA' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' -keyout "$RUNNER_TEMP/ns-replay-ca.key" -out "$RUNNER_TEMP/ns-replay-ca.crt" 2>/dev/null
          openssl req -new -newkey rsa:2048 -nodes -subj '/CN=127.0.0.1' -keyout "$RUNNER_TEMP/ns-replay.key" -out "$RUNNER_TEMP/ns-replay.csr" 2>/dev/null
          printf '%s\n' 'basicConstraints=critical,CA:FALSE' 'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' 'subjectAltName=IP:127.0.0.1' > "$RUNNER_TEMP/ns-replay.ext"
          openssl x509 -req -in "$RUNNER_TEMP/ns-replay.csr" -CA "$RUNNER_TEMP/ns-replay-ca.crt" -CAkey "$RUNNER_TEMP/ns-replay-ca.key" -CAcreateserial -days 1 -extfile "$RUNNER_TEMP/ns-replay.ext" -out "$RUNNER_TEMP/ns-replay.crt" 2>/dev/null
          openssl verify -CAfile "$RUNNER_TEMP/ns-replay-ca.crt" "$RUNNER_TEMP/ns-replay.crt"
          rm -f "$RUNNER_TEMP/ns-replay-ca.key"
          chmod 600 "$RUNNER_TEMP/ns-replay.key"
          # Only change the listening port in an isolated copy; do not change any gateway logic.
          cp -r supabase/functions/naxa-services-accounting "$RUNNER_TEMP/ns-accounting"
          test "$(grep -Fc 'Deno.serve(async (request) => {' "$RUNNER_TEMP/ns-accounting/index.ts")" = 1
          sed -i 's/Deno.serve(async (request) => {/Deno.serve({port:8001},async (request) => {/' "$RUNNER_TEMP/ns-accounting/index.ts"
      - name: Exercise real Auth Admin, gateway, JWT, private Storage, billing and push registration
        shell: bash
        run: |
          set -euo pipefail
          set -a; source "$RUNNER_TEMP/ns-replay.env"; set +a
          [[ "$API_URL" == http://127.0.0.1:54321 ]] || exit 1
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export NS_ALLOWED_ORIGINS=http://127.0.0.1:4173,https://127.0.0.1:8443 NS_AUTH_ALIAS_DOMAIN=example.test
          export NS_PUSH_TOKEN_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          export NS_NOTIFICATION_WORKER_SECRET="$(openssl rand -hex 32)"
          unset FCM_SERVICE_ACCOUNT_JSON NS_FIREBASE_PROJECT_ID
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {randomUUID,randomBytes} from 'node:crypto';
          import {spawn} from 'node:child_process';
          import {chromium} from '@playwright/test';
          import https from 'node:https';
          import http from 'node:http';
          import {readFile,stat} from 'node:fs/promises';
          import {resolve,extname,sep} from 'node:path';
          const base=process.env.SUPABASE_URL, anon=process.env.SUPABASE_ANON_KEY, admin=process.env.SUPABASE_SERVICE_ROLE_KEY;
          assert.equal(base,'http://127.0.0.1:54321');
          const gateway='http://127.0.0.1:8000';
          let child;
          const pause=ms=>new Promise(r=>setTimeout(r,ms));
          async function stop(){if(child){const c=child;child=undefined;c.kill('SIGTERM');if(c.exitCode===null)await new Promise(r=>c.once('exit',r));}}
          async function start(name){
            await stop();
            child=spawn('deno',['run','--allow-env','--allow-net=127.0.0.1:54321,0.0.0.0:8000,127.0.0.1:8000','supabase/functions/naxa-services-'+name+'/index.ts'],{stdio:['ignore','ignore','ignore']});
            for(let i=0;i<40;i++){try{const r=await fetch(gateway,{method:'OPTIONS'});if(r.ok)return;}catch{}if(child.exitCode!==null)break;await pause(250);}
            throw Error('GATEWAY_START_FAILED_'+name);
          }
          const headers=(token=admin,key=admin)=>({apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json'});
          async function json(url,body,token=admin,key=admin,method='POST'){
            const r=await fetch(url,{method,headers:{...headers(token,key),Prefer:'return=representation'},...(body===undefined?{}:{body:JSON.stringify(body)})});
            const data=await r.json().catch(()=>null);
            return {status:r.status,data};
          }
          async function success(url,body,token=admin,key=admin,method='POST'){
            const r=await json(url,body,token,key,method);assert.ok(r.status>=200&&r.status<300,'HTTP '+r.status+' at '+new URL(url).pathname);return r.data;
          }
          const rest=(table,body)=>success(base+'/rest/v1/'+table,body);
          const pass=label=>console.log('PASS '+label);
          async function fixture(suffix){
            const email='ns-replay-'+suffix+'-'+randomUUID()+'@example.test', password='Qa7!'+randomBytes(18).toString('hex');
            const user=await success(base+'/auth/v1/admin/users',{email,password,email_confirm:true,app_metadata:{app_code:'naxa-services'}});
            assert.match(user.id,/^[0-9a-f-]{36}$/);
            const [org]=await rest('ns_organizations',{display_name:'Replay '+suffix,business_mode:'solo'});
            const login='NS-'+randomBytes(5).toString('hex').toUpperCase();
            const [account]=await rest('ns_accounts',{auth_user_id:user.id,login_id:login,auth_alias:email,password_change_required:false});
            const [member]=await rest('ns_members',{org_id:org.id,account_id:account.id,display_name:'Recette '+suffix,role_code:'promoter'});
            const [site]=await rest('ns_sites',{org_id:org.id,code:'REPLAY',name:'Recette isolée'});
            await rest('ns_member_scopes',{org_id:org.id,member_id:member.id,scope_type:'organization',scope_id:org.id,can_read:true,can_operate:true,can_manage:true});
            return {user,org,member,site,login,password,device:{installation_id:randomUUID(),platform:'web',label:'Replay'}};
          }
          const act=(action,body={},token=anon)=>json(gateway,{app_code:'naxa-services',action,...body},token,anon);
          async function login(f){const r=await act('login',{identifier:f.login,password:f.password,device:f.device});assert.equal(r.status,200,'positive login');assert.equal(r.data.account.organization_id,f.org.id);assert.deepEqual(r.data.account.active_site_ids,[f.site.id]);assert.ok(r.data.access_token&&r.data.refresh_token&&r.data.device_id);return r.data;}
          async function browserReplay(f){
            let browser,server,accounting;
            const root=resolve('apps/web/naxa-services/dist');
            const types={'.html':'text/html','.js':'application/javascript','.css':'text/css','.svg':'image/svg+xml','.png':'image/png','.jpg':'image/jpeg','.webp':'image/webp','.json':'application/json','.webmanifest':'application/manifest+json','.woff2':'font/woff2'};
            try{
              accounting=spawn('deno',['run','--cert',process.env.RUNNER_TEMP+'/ns-replay-ca.crt','--allow-env','--allow-net=127.0.0.1:8443,0.0.0.0:8001,127.0.0.1:8001',process.env.RUNNER_TEMP+'/ns-accounting/index.ts'],{env:{...process.env,SUPABASE_URL:'https://127.0.0.1:8443'},stdio:'ignore'});
              let ready=false;
              for(let i=0;i<40;i++){try{if((await fetch('http://127.0.0.1:8001',{method:'OPTIONS'})).ok){ready=true;break;}}catch{}if(accounting.exitCode!==null)break;await pause(250);}
              assert.ok(ready,'real accounting gateway ready');
              server=https.createServer({key:await readFile(process.env.RUNNER_TEMP+'/ns-replay.key'),cert:await readFile(process.env.RUNNER_TEMP+'/ns-replay.crt')},async(req,res)=>{
                try{
                  const path=new URL(req.url,'https://127.0.0.1:8443').pathname;
                  let upstream;
                  if(path==='/functions/v1/naxa-services-auth')upstream='http://127.0.0.1:8000'+req.url;
                  else if(path==='/functions/v1/naxa-services-accounting')upstream='http://127.0.0.1:8001'+req.url;
                  else if(path.startsWith('/storage/v1/')||path==='/auth/v1/user'||path.startsWith('/rest/v1/'))upstream=base+req.url;
                  if(upstream){const u=new URL(upstream);const forward=http.request(u,{method:req.method,headers:{...req.headers,host:u.host}},r=>{res.writeHead(r.statusCode,r.headers);r.pipe(res);});forward.on('error',()=>{if(!res.headersSent)res.writeHead(502);res.end();});req.pipe(forward);return;}
                  let file=resolve(root,'.'+decodeURIComponent(path));if(file!==root&&!file.startsWith(root+sep)){res.writeHead(403);res.end();return;}
                  if(!(await stat(file).catch(()=>null))?.isFile())file=resolve(root,'index.html');
                  res.writeHead(200,{'Content-Type':types[extname(file)]??'application/octet-stream','Cache-Control':'no-store'});res.end(await readFile(file));
                }catch{if(!res.headersSent)res.writeHead(500);res.end();}
              });
              await new Promise((r,j)=>{server.once('error',j);server.listen(8443,'127.0.0.1',r);});
              // Prove transport trust with the same Deno runtime before business traffic.
              const transport=spawn('deno',['eval','--cert',process.env.RUNNER_TEMP+'/ns-replay-ca.crt',"const r=await fetch('https://127.0.0.1:8443/auth/v1/user');if(r.status!==401)throw Error('Expected unauthenticated probe HTTP 401, got '+r.status);console.log('PASS Deno trusted HTTPS to local Auth');"],{stdio:'inherit'});
              assert.equal(await new Promise((r,j)=>{transport.on('error',j);transport.on('exit',r);}),0,'Deno TLS probe');
              browser=await chromium.launch({headless:true});
              const context=await browser.newContext({ignoreHTTPSErrors:true,viewport:{width:1440,height:900}});
              const page=await context.newPage();page.setDefaultTimeout(15000);
              await page.goto('https://127.0.0.1:8443/');
              await page.getByLabel('Identifiant NAXA Services').fill(f.login);
              await page.getByLabel('Mot de passe',{exact:true}).fill(f.password);
              const loginResponse=page.waitForResponse(r=>r.url().endsWith('/functions/v1/naxa-services-auth')&&r.request().method()==='POST'&&r.request().postDataJSON()?.action==='login');
              await page.getByRole('button',{name:'Se connecter',exact:true}).click();
              const lr=await loginResponse;const ld=await lr.json();
              console.log('Replay browser login HTTP',lr.status(),'refresh token length',typeof ld.refresh_token==='string'?ld.refresh_token.length:0,'account present',Boolean(ld.account));
              assert.equal(lr.status(),200,'browser login HTTP');
              assert.ok(ld.account&&ld.access_token&&ld.refresh_token,'browser auth response structure');
              await page.getByRole('heading',{name:'Une journée bien organisée commence ici.'}).waitFor();
              await page.getByRole('combobox',{name:'Langue',exact:true}).selectOption('en');
              await page.getByRole('heading',{name:'A well-organized day starts here.'}).waitFor();
              await page.getByRole('combobox',{name:'Language',exact:true}).selectOption('ff-CM');
              await page.getByRole('heading',{name:'Ñalawma moƴƴo fuɗɗata ɗoo.'}).waitFor();
              await page.getByRole('button',{name:/Yaltu/}).click();
              await page.getByLabel('Innol NAXA Services').fill(f.login);
              await page.getByLabel('Finnde',{exact:true}).fill(f.password);
              await page.getByRole('button',{name:'Naatu',exact:true}).click();
              await page.getByRole('heading',{name:'Ñalawma moƴƴo fuɗɗata ɗoo.'}).waitFor();
              await page.getByRole('combobox',{name:'Ɗemngal',exact:true}).selectOption('fr');
              await page.getByRole('heading',{name:'Une journée bien organisée commence ici.'}).waitFor();
              pass('real Chromium authentication, FR EN FF navigation and GoTrue member preference after signout/signin');
              // Use the actual Web outbox, accounting gateway, RPC and PostgreSQL, not route stubs.
              const customer='Client Replay '+randomBytes(6).toString('hex');
              await page.getByRole('button',{name:/Clients & fidélité/}).first().click();
              await page.getByRole('button',{name:'Créer une fiche client'}).click();
              await page.getByLabel('Nom du client').fill(customer);
              await page.getByLabel('Téléphone facultatif').fill('+237699000111');
              const receipt=page.waitForResponse(r=>r.url().endsWith('/functions/v1/naxa-services-accounting')&&r.request().method()==='POST'&&r.request().postDataJSON()?.action==='apply_sync_event',{timeout:25000});
              await page.getByRole('button',{name:'Enregistrer',exact:true}).click();
              const response=await receipt;const result=await response.json();
              const err=typeof result.error==='string'?result.error:'';
              const errorKind=/^[A-Z0-9_]{1,80}$/.test(err)?err:/certificate|tls|ssl|issuer/i.test(err)?'TLS_CERTIFICATE':/permission denied|requires net access/i.test(err)?'DENO_PERMISSION':/fetch|connection|network/i.test(err)?'FETCH_TRANSPORT':'OTHER';
              console.log('Replay customer write HTTP',response.status(),'error class',errorKind,'receipt status',result.result?.status??'absent');
              assert.equal(response.status(),200);assert.equal(result.ok,true);assert.equal(result.result.status,'applied');
              const records=await success(base+'/rest/v1/ns_customers?select=id&org_id=eq.'+f.org.id+'&display_name=eq.'+encodeURIComponent(customer),undefined,admin,admin,'GET');
              assert.equal(records.length,1);
              pass('real Chromium customer creation, offline queue, accounting receipt and persisted PostgreSQL row');
              const failures=[];
              async function scenario(label,run){
                try{await run();pass(label);}catch(e){failures.push(label);console.log('FAIL independent browser scenario:',label, e instanceof Error?e.name:'Error');}
              }
              const nav=async label=>{await page.locator('.side-nav button.nav-item').filter({hasText:label}).click();};
              const apply=async(action,click)=>{
                const receipt=page.waitForResponse(r=>r.url().endsWith('/functions/v1/naxa-services-accounting')&&r.request().method()==='POST'&&r.request().postDataJSON()?.action==='apply_sync_event'&&r.request().postDataJSON()?.event?.action_code===action,{timeout:25000});
                await click();
                const response=await receipt,result=await response.json();
                console.log('Replay',action,'HTTP',response.status(),'receipt',result.result?.status??'absent','error',typeof result.error==='string'&&/^[A-Z0-9_]{1,80}$/.test(result.error)?result.error:'none');
                assert.equal(response.status(),200,action);assert.equal(result.ok,true,action);assert.equal(result.result.status,'applied',action);
                return response.request().postDataJSON().event;
              };
              const count=async(table,filter)=>{assert.match(table,/^ns_[a-z_]+$/);return (await success(base+'/rest/v1/'+table+'?select=id&org_id=eq.'+f.org.id+'&'+filter,undefined,admin,admin,'GET')).length;};
              await scenario('real cash register, opening, cash and external Mobile Money sales, double-open prevention and close',async()=>{
                await nav('Caisse & ventes');
                await page.getByLabel('Code unique').fill('REPLAY-CASH');
                await page.getByLabel('Nom du registre').fill('Caisse Replay');
                const register=await apply('cash_register.created',()=>page.getByRole('button',{name:'Créer le registre',exact:true}).click());
                assert.equal(await count('ns_cash_registers','id=eq.'+register.aggregate_id),1);
                await page.getByLabel("Fonds d'ouverture (FCFA)").fill('5000');
                const shift=await apply('cash_session.opened',()=>page.getByRole('button',{name:'Ouvrir la caisse',exact:true}).click());
                await page.getByRole('heading',{name:'Session actuellement ouverte'}).waitFor();
                assert.equal(await page.getByRole('button',{name:'Ouvrir la caisse',exact:true}).isDisabled(),true);
                await page.getByLabel('Désignation vendue').fill('Prestation Replay espèces');
                await page.getByLabel('Total encaissé (FCFA)').fill('2500');
                const cashSale=await apply('sale.created',()=>page.getByRole('button',{name:'Enregistrer la vente comptant'}).click());
                assert.equal(cashSale.payload.payment_method,'cash');
                assert.equal(await count('ns_sales','id=eq.'+cashSale.aggregate_id),1);
                await page.getByLabel('Désignation vendue').fill('Prestation Replay MoMo externe');
                await page.getByRole('combobox',{name:'Mode d’encaissement reçu'}).selectOption('mobile_money');
                await page.getByLabel('Total encaissé (FCFA)').fill('1000');
                const mobileSale=await apply('sale.created',()=>page.getByRole('button',{name:'Enregistrer la vente comptant'}).click());
                assert.equal(mobileSale.payload.payment_method,'mobile_money');
                assert.equal(await count('ns_sales','id=eq.'+mobileSale.aggregate_id),1);
                await page.getByLabel('Montant compté à la clôture (FCFA)').fill('7500');
                await apply('cash_session.closed',()=>page.getByRole('button',{name:"Clôturer et calculer l'écart"}).click());
                const rows=await success(base+'/rest/v1/ns_cash_sessions?select=*&org_id=eq.'+f.org.id+'&id=eq.'+shift.aggregate_id,undefined,admin,admin,'GET');
                assert.equal(rows.length,1);assert.equal(rows[0].status,'closed');
              });
              await scenario('real staff attendance: arrival, break, resume and departure',async()=>{
                await nav('Équipe & commissions');
                for(const [label,action] of [['Pointer mon arrivée','staff_clock_in.recorded'],['Commencer une pause','staff_break_start.recorded'],['Terminer la pause','staff_break_end.recorded'],['Pointer mon départ','staff_clock_out.recorded']]){
                  await apply(action,()=>page.locator('.module-main-card .activity-transition-buttons').first().getByRole('button',{name:label,exact:true}).click());
                }
                await page.locator('.module-main-card .activity-transition-buttons').first().getByRole('button',{name:'Pointer mon arrivée',exact:true}).waitFor();
              });
              await scenario('real offline customer creation and exactly-one durable row after reconnection',async()=>{
                await nav('Clients & fidélité');
                const offlineCustomer='Client hors ligne '+randomBytes(6).toString('hex');
                const filter='display_name=eq.'+encodeURIComponent(offlineCustomer);
                await context.setOffline(true);
                try{
                  await page.getByRole('button',{name:'Créer une fiche client',exact:true}).click();
                  await page.getByLabel('Nom du client').fill(offlineCustomer);
                  await page.getByRole('button',{name:'Enregistrer',exact:true}).click();
                  await page.getByText(/enregistré hors connexion/i).waitFor();
                  assert.equal(await count('ns_customers',filter),0);
                }finally{await context.setOffline(false);}
                const sync=page.getByRole('button',{name:/Synchroniser \(/});
                for(let i=0;i<40;i++){
                  if(await count('ns_customers',filter)===1)break;
                  if(await sync.isVisible()&&await sync.isEnabled())await sync.click();
                  await pause(400);
                }
                assert.equal(await count('ns_customers',filter),1);
                await pause(800);
                assert.equal(await count('ns_customers',filter),1);
              });
              await scenario('real authenticated profile photo: browser upload and deletion',async()=>{
                const photoButton=page.getByRole('button',{name:'Photo de profil',exact:true});
                await photoButton.waitFor();
                await page.getByLabel('Fichier photo de profil').setInputFiles({name:'replay.png',mimeType:'image/png',buffer:Buffer.from('iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAGUlEQVR4nGOsbvFjIAUwkaR6VMOohiGlAQAtrwFtmi6mgwAAAABJRU5ErkJggg==','base64')});
                await page.getByText('Photo enregistrée.',{exact:true}).waitFor();
                await page.getByAltText('Photo de profil').waitFor();
                page.once('dialog',dialog=>dialog.accept());
                await page.getByRole('button',{name:'Supprimer la photo',exact:true}).click();
                await page.getByText('Photo supprimée.',{exact:true}).waitFor();
                assert.equal(await page.getByAltText('Photo de profil').count(),0);
              });
