name: NAXA SERVICES — encrypted backup and restore drill

on:
  push:
    branches: [work/naxa-services-completion-20261120]
    paths:
      - 'docs/naxa-services/NAXA_SERVICES_GLOBAL_QUALIFICATION_2026-11-27.json'
      - 'infra/backup/**'
      - '.github/workflows/naxa-services-backup-restore.yml'
      - 'docs/naxa-services/NAXA_SERVICES_EXECUTION_REGISTRY.json'
      - 'apps/android/naxa-services/**'
      - 'apps/android/naxa-services-beneficiary/**'
      - 'apps/web/naxa-services/**'
      - 'assets/naxa-services/**'
      - 'packages/core-android/**'
      - 'packages/core-web/**'
      - 'packages/contracts/**'
      - 'packages/billing-core/**'
      - 'packages/finance-core/**'
      - 'packages/offline-web/**'
      - 'packages/design-system/**'
      - 'supabase/functions/naxa-services-*/**'
      - 'supabase/drafts/naxa_services_*.sql'
      - 'supabase/tests/drafts/naxa_services_*.sql'
      - 'scripts/naxa-services/**'
      - '.github/scripts/naxa-services/**'
      - 'supabase/config.toml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/naxa-services-technical-gate.yml'
      - '.github/workflows/naxa-services-replay-isolated.yml'
      - '.github/workflows/naxa-services-independent-reserves.yml'
      - '.github/workflows/naxa-services-cloudflare-preflight.yml'
      - '.github/workflows/naxa-services-hosted-device-test.yml'
      - '.github/workflows/naxa-services-release-readiness.yml'
      - '.github/workflows/naxa-services-individual-qualification.yml'
  pull_request:
    paths:
      - "infra/backup/**"
      - ".github/workflows/naxa-services-backup-restore.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-restore-drill:
    name: PostgreSQL 17 encrypted backup and clean restore
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL client and GnuPG
        run: sudo apt-get update && sudo apt-get install -y postgresql-client gnupg
      - name: Create isolated source and restore databases
        run: |
          createdb naxa_backup_source
          createdb naxa_backup_target
      - name: Run encrypted backup and full restore drill
        env:
          BACKUP_TEST_SOURCE_URL: postgres://postgres:postgres@localhost:5432/naxa_backup_source
          BACKUP_TEST_TARGET_URL: postgres://postgres:postgres@localhost:5432/naxa_backup_target
        run: bash infra/backup/test-backup-restore.sh
